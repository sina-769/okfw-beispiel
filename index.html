 CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}, {"key": "tu-tool-registry-code", "page": "sources/tu-tool-registry-code", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026h). \u003cem>Tool registry and automatic discovery (source code)\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\u003c/a>", "access": "fulltext", "order": 7}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Die Kurzreferenz verlangt eine Datei auf _tool.py und nennt die Endung als Ursache, wenn ein Tool nicht gefunden wird (mims-harvard, 2026e, Zeile 150 und 170); nach dem Quellcode findet die Lazy-Suche dekorierte Klassen …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/remote-tool", "title": "Remote-Tool", "type": "concept", "description": "Tool auf eigenem Server, angesprochen über MCP oder REST; für einen Beitrag öffentlich erreichbar oder mit Anleitung zur Bereitstellung.", "access": "", "in": 5, "out": 3, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["Remote Tool", "entferntes Tool", "RemoteTool"], "cite": "", "ris": "", "heading": "Remote-Tool", "html": "\u003cp>Ein Remote-Tool läuft auf einem eigenen Server und wird über MCP oder REST angesprochen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 4.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 4\u003c/a>)\u003c/span>; es kann in jeder\nSprache geschrieben sein und eignet sich für aufwendige Berechnungen und externe Dienste \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"contributing-index.rst, Zeile 13–30.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 13–30\u003c/a>)\u003c/span>. Empfohlen ist\nein eigenständiger MCP-Server, dessen Code unter \u003ccode>src/tooluniverse/remote/\u003c/code> liegt; als einfachere Variante nennt\nder Leitfaden den Dekorator \u003ccode>register_mcp_tool\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 47–60.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 47–60\u003c/a>)\u003c/span>\u003c/p>\n\u003cp>Die Konfiguration steht in \u003ccode>src/tooluniverse/data/remote_tools/\u003c/code> mit Typ \u003ccode>RemoteTool\u003c/code> und \u003ccode>remote_info\u003c/code>\n(Servertyp, Transport, URL, Code-URL) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 125–158.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 125–158\u003c/a>)\u003c/span>. Für einen Beitrag muss der Server öffentlich erreichbar sein, oder\nes braucht eine ausführliche Anleitung zur Bereitstellung, etwa mit Docker; \u003ccode>__init__.py\u003c/code> bleibt\nunverändert \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 7.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 7\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 174–185.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 174–185\u003c/a>)\u003c/span>. Getestet wird mit Integrationstests gegen einen gemockten Server \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 19 und 223–226.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 19 und 223–226\u003c/a>)\u003c/span>.\u003c/p>\n\u003cblockquote class=\"callout todo\" id=\"offen-1\">\n\u003cp>Die Variante mit \u003ccode>register_mcp_tool\u003c/code> ist im Leitfaden nur genannt; wie sie aussieht, beschreibt keine\nQuelle dieses Wikis.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Ein Remote-Tool läuft auf einem eigenen Server und wird über MCP oder REST angesprochen (mims-harvard, 2026b, Zeile 4); es kann in jeder Sprache geschrieben sein und eignet sich für aufwendige Berechnungen und externe Dienste (mims-harvard, 2026b, Zeile 13–30). Empfohlen ist ein eigenständiger MCP-Server, dessen Code …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "access": "fulltext", "order": 1}], "apa": null, "open": [{"kind": "todo", "id": "offen-1", "text": "Die Variante mit register_mcp_tool ist im Leitfaden nur genannt; wie sie aussieht, beschreibt keine Quelle dieses Wikis."}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/skills-beitragen", "title": "Agent-Skills beitragen", "type": "concept", "description": "Aufbau eines Skills, Regeln für Beiträge und die statische Prüfung der Tool-Aufrufe in Skill-Texten.", "access": "", "in": 4, "out": 4, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["Skills", "SKILL.md", "Agent Skills"], "cite": "", "ris": "", "heading": "Agent-Skills beitragen", "html": "\u003cp>Skills sind vorgefertigte Forschungs-Workflows für Agenten \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"README.md der Skills, Zeile 3 und 20–92.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 3 und 20–92\u003c/a>)\u003c/span>; installiert werden sie mit\n\u003ccode>npx skills add mims-harvard/ToolUniverse\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"README.md der Skills, Zeile 12–16.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 12–16\u003c/a>)\u003c/span> Ein Skill ist ein Ordner mit \u003ccode>SKILL.md\u003c/code> (unter 500 Zeilen)\nund optional \u003ccode>QUICK_START.md\u003c/code>, \u003ccode>EXAMPLES.md\u003c/code> und \u003ccode>references/\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"README.md der Skills, Zeile 130–138.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 130–138\u003c/a>)\u003c/span> Für einen Beitrag: \u003ccode>SKILL.md\u003c/code> mit\nFrontmatter anlegen, knapp halten, Beispiele für häufige Fälle ergänzen und keine host-spezifischen Metadaten wie\n\u003ccode>agents/openai.yaml\u003c/code> in den kanonischen Skill schreiben \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"README.md der Skills, Zeile 140–148.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 140–148\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>Tool-Aufrufe in Skill-Texten prüft \u003ccode>scripts/check_skill_tool_calls.py\u003c/code> statisch gegen die Schemas in\n\u003ccode>src/tooluniverse/data/*.json\u003c/code>: unbekannte Argumente, fehlende Pflichtargumente und Tool-Namen, die es nicht\ngibt; Letztere aber nur, wenn mindestens zwei echte Tools dasselbe Präfix tragen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"check_skill_tool_calls.py, Zeile 2–23, 52–55 und 132–140.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 2–23, 52–55 und 132–140\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp id=\"offen-2\">\u003cstrong>Zu prüfen:\u003c/strong> Das README des Projekts nennt 68 Forschungs-Workflows \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-readme\" title=\"README.md, Zeile 99.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026k, Zeile 99\u003c/a>)\u003c/span>, das README der Skills 69\nForschungs-Skills, und seine Tabelle hat 69 Zeilen einschließlich des Routers \u003ccode>tooluniverse\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"README.md der Skills, Zeile 3 und 20–92.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 3 und 20–92\u003c/a>)\u003c/span> Ob die 68\nden Router nicht mitzählen, sagen die Quellen nicht.\u003c/p>\n\u003cblockquote class=\"callout todo\" id=\"offen-1\">\n\u003cp>Den vollständigen Ablauf beschreibt der Skill \u003ccode>create-tooluniverse-skill\u003c/code>; er gehört nicht zu den\nQuellen dieses Wikis.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"entities/tooluniverse\" href=\"#entities/tooluniverse\">ToolUniverse\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Skills sind vorgefertigte Forschungs-Workflows für Agenten (mims-harvard, 2026j, Zeile 3 und 20–92); installiert werden sie mit npx skills add mims-harvard/ToolUniverse. (mims-harvard, 2026j, Zeile 12–16) Ein Skill ist ein Ordner mit SKILL.md (unter 500 Zeilen) und optional QUICK_START.md, EXAMPLES.md und references/. …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-skills-and-githooks", "page": "sources/tu-skills-and-githooks", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026j). \u003cem>ToolUniverse Skills (README), Git hooks and skill call check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 9}, {"key": "tu-readme", "page": "sources/tu-readme", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026k, Oktober 24). \u003cem>ToolUniverse: Democratizing AI scientists (README)\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\u003c/a>", "access": "fulltext", "order": 10}], "apa": null, "open": [{"kind": "todo", "id": "offen-1", "text": "Den vollständigen Ablauf beschreibt der Skill create-tooluniverse-skill; er gehört nicht zu den Quellen dieses Wikis."}, {"kind": "check", "id": "offen-2", "text": "Zu prüfen: Das README des Projekts nennt 68 Forschungs-Workflows (mims-harvard, 2026k, Zeile 99), das README der Skills 69 Forschungs-Skills, und seine Tabelle hat 69 Zeilen einschließlich des Routers tooluniverse. …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/testkategorien-und-marker", "title": "Testkategorien und pytest-Marker", "type": "concept", "description": "Testordner nach Art des Tests, Pflicht-Marker und was ein einfacher pytest-Aufruf tatsächlich sammelt.", "access": "", "in": 9, "out": 5, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["Marker", "Testordner", "tests/unit"], "cite": "", "ris": "", "heading": "Testkategorien und pytest-Marker", "html": "\u003cp>Die Testsuite ist nach Art des Tests geordnet: \u003ccode>tests/unit/\u003c/code> für schnelle, isolierte Tests ohne Netz,\n\u003ccode>tests/integration/\u003c/code> für Tests mit Netz oder echten Tools, \u003ccode>tests/tools/\u003c/code> je Tool und \u003ccode>tests/api/\u003c/code> für externe\nDienste \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"README.md der Testsuite, Zeile 3–9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–9\u003c/a>)\u003c/span>. Jeder Test braucht einen passenden Marker, einen Namen nach \u003ccode>test_&lt;was&gt;_&lt;erwartung&gt;\u003c/code> und einen\nDocstring; Unit-Tests bleiben unter einer Sekunde \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"README.md der Testsuite, Zeile 37–43.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 37–43\u003c/a>)\u003c/span>. Die Marker sind in \u003ccode>pytest.ini\u003c/code> festgelegt, darunter\n\u003ccode>unit\u003c/code>, \u003ccode>integration\u003c/code>, \u003ccode>network\u003c/code>, \u003ccode>slow\u003c/code>, \u003ccode>require_api_keys\u003c/code> und \u003ccode>require_gpu\u003c/code>; unbekannte Marker sind wegen\n\u003ccode>--strict-markers\u003c/code> ein Fehler \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"pytest.ini, Zeile 15–35.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 15–35\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"pytest.ini, Zeile 3–9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–9\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>Ein einfacher \u003ccode>pytest\u003c/code>-Aufruf sammelt in \u003ccode>tests/unit\u003c/code>, \u003ccode>tests/integration\u003c/code> und \u003ccode>tests/test_database_setup\u003c/code>, lässt\n\u003ccode>tools\u003c/code>, \u003ccode>examples\u003c/code> und \u003ccode>api\u003c/code> aus, wählt alles ohne \u003ccode>slow\u003c/code>, \u003ccode>require_api_keys\u003c/code> und \u003ccode>network\u003c/code> und misst die\nAbdeckung mit \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"pytest.ini, Zeile 3–9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–9\u003c/a>)\u003c/span>. Die CI schließt zusätzlich \u003ccode>require_gpu\u003c/code> aus \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 185–200.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 185–200\u003c/a>)\u003c/span>. Tests mit Netz oder API-Schlüssel\nsollen markiert oder von den Standardprüfungen getrennt sein, fragt die PR-Vorlage \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 10.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 10\u003c/a>)\u003c/span>.\u003c/p>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Das README der Testsuite sagt, \u003ccode>pytest\u003c/code> ohne Argumente führe nur Unit-Tests aus \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"README.md der Testsuite, Zeile 15.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 15\u003c/a>)\u003c/span>;\nnach \u003ccode>pytest.ini\u003c/code> sammelt der Aufruf auch Integrationstests (\u003ca data-page=\"sources/tu-tests-and-ci\" href=\"#sources/tu-tests-and-ci\">Testsuite und CI\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"pytest.ini, Zeile 3–9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–9\u003c/a>)\u003c/span>.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"entities/pytest\" href=\"#entities/pytest\">pytest\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Die Testsuite ist nach Art des Tests geordnet: tests/unit/ für schnelle, isolierte Tests ohne Netz, tests/integration/ für Tests mit Netz oder echten Tools, tests/tools/ je Tool und tests/api/ für externe Dienste (mims-harvard, 2026f, Zeile 3–9). Jeder Test braucht einen passenden Marker, einen Namen nach …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-pr-template", "page": "sources/tu-pr-template", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026d, Oktober 24). \u003cem>Pull request template\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\u003c/a>", "access": "fulltext", "order": 3}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Das README der Testsuite sagt, pytest ohne Argumente führe nur Unit-Tests aus (mims-harvard, 2026f, Zeile 15); nach pytest.ini sammelt der Aufruf auch Integrationstests (Testsuite und CI) (mims-harvard, 2026f, Zeile …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/tool-konfiguration", "title": "Tool-Konfiguration (JSON)", "type": "concept", "description": "Die Beschreibung eines Tools mit name, type, description und parameter, dazu test_examples und return_schema für das Testskript.", "access": "", "in": 9, "out": 9, "domain": [], "subtype": "", "subfield": "", "tags": ["einstieg"], "aliases": ["Tool-Spezifikation", "Tool config", "xxx_tools.json"], "cite": "", "ris": "", "heading": "Tool-Konfiguration (JSON)", "html": "\u003cp>Jedes Tool wird durch eine Konfiguration beschrieben: \u003ccode>name\u003c/code> als Aufrufname, \u003ccode>type\u003c/code> als Name der registrierten\nKlasse, \u003ccode>description\u003c/code> und \u003ccode>parameter\u003c/code> als JSON-Schema der Argumente \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 154.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 154\u003c/a>)\u003c/span>. Für ein beigetragenes lokales Tool\nsteht sie in \u003ccode>src/tooluniverse/data/&lt;name&gt;_tools.json\u003c/code> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 102–134.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 102–134\u003c/a>)\u003c/span>, für ein Remote-Tool in \u003ccode>data/remote_tools/\u003c/code> mit\nTyp \u003ccode>RemoteTool\u003c/code> und einem Block \u003ccode>remote_info\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"remote_tools.rst, Zeile 125–158.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 125–158\u003c/a>)\u003c/span> Das Beispiel im Leitfaden enthält außerdem \u003ccode>examples\u003c/code>,\n\u003ccode>tags\u003c/code>, \u003ccode>author\u003c/code> und \u003ccode>version\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 124–133.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 124–133\u003c/a>)\u003c/span>\u003c/p>\n\u003cp>Das Testskript liest aus der Konfiguration \u003ccode>test_examples\u003c/code> und \u003ccode>return_schema\u003c/code>: Es ruft das Tool mit den\nBeispielen auf und prüft die Antwort gegen das Schema (\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 3–9 und 247–248.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 3–9 und 247–248\u003c/a>)\u003c/span>.\nÄndert sich eine Konfiguration, erzeugt \u003ccode>build_tools.py\u003c/code> den zugehörigen Code neu\n(\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"BUILD_TOOLS_GUIDE.md, Zeile 5–23.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 5–23\u003c/a>)\u003c/span>.\u003c/p>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Für Beiträge gehört die Konfiguration in die JSON-Datei, nicht in den Dekorator\n(\u003ca data-page=\"sources/tu-expand-contributing\" href=\"#sources/tu-expand-contributing\">Expand ToolUniverse\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 83 und 361–364.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 83 und 361–364\u003c/a>)\u003c/span>; die \u003ca data-page=\"sources/tu-adding-tools-quickref\" href=\"#sources/tu-adding-tools-quickref\">Kurzreferenz\u003c/a>\nlegt die Tool-Datei in \u003ccode>src/tooluniverse/\u003c/code> ab und übergibt die Konfiguration im Dekorator \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 5–20.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 5–20\u003c/a>)\u003c/span>. Der Dekorator\nselbst nimmt beides an. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 58–89.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 58–89\u003c/a>)\u003c/span>\u003c/p>\n\u003c/blockquote>\n\u003cp id=\"offen-2\">\u003cstrong>Zu prüfen:\u003c/strong> Das Konfigurationsbeispiel im Leitfaden nennt das Feld \u003ccode>examples\u003c/code> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 124–133.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 124–133\u003c/a>)\u003c/span>, das Testskript liest\n\u003ccode>test_examples\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 3–9 und 247–248.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 3–9 und 247–248\u003c/a>)\u003c/span> Ob beide Felder nebeneinander bestehen sollen, sagen die Quellen nicht.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>, \u003ca data-page=\"concepts/remote-tool\" href=\"#concepts/remote-tool\">Remote-Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Jedes Tool wird durch eine Konfiguration beschrieben: name als Aufrufname, type als Name der registrierten Klasse, description und parameter als JSON-Schema der Argumente (mims-harvard, 2026e, Zeile 154). Für ein beigetragenes lokales Tool steht sie in src/tooluniverse/data/\u003cname>_tools.json (mims-harvard, 2026b …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "access": "fulltext", "order": 1}, {"key": "tu-adding-tools-quickref", "page": "sources/tu-adding-tools-quickref", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026e, Oktober 24). \u003cem>Quick Reference – Adding Tools; Tool Generation Guide\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\u003c/a>", "access": "fulltext", "order": 4}, {"key": "tu-tool-registry-code", "page": "sources/tu-tool-registry-code", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026h). \u003cem>Tool registry and automatic discovery (source code)\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\u003c/a>", "access": "fulltext", "order": 7}, {"key": "tu-tool-test-scripts", "page": "sources/tu-tool-test-scripts", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026i). \u003cem>Tool test scripts and weekly health check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 8}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Für Beiträge gehört die Konfiguration in die JSON-Datei, nicht in den Dekorator (Expand ToolUniverse) (mims-harvard, 2026b, Zeile 83 und 361–364); die Kurzreferenz legt die Tool-Datei in src/tooluniverse/ ab und …"}, {"kind": "check", "id": "offen-2", "text": "Zu prüfen: Das Konfigurationsbeispiel im Leitfaden nennt das Feld examples (mims-harvard, 2026b, Zeile 124–133), das Testskript liest test_examples. (mims-harvard, 2026i, Zeile 3–9 und 247–248) Ob beide Felder …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/tool-tests-mit-beispielen", "title": "Tool-Tests mit Beispielen und Schema", "type": "concept", "description": "test_new_tools.py und test_all_tools.py prüfen Tools über ihre eigene Konfiguration, die Wochenprüfung gegen die echten APIs.", "access": "", "in": 8, "out": 6, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["test_new_tools.py", "test_all_tools.py", "Wochenprüfung", "Health Check"], "cite": "", "ris": "", "heading": "Tool-Tests mit Beispielen und Schema", "html": "\u003cp>Neben pytest gibt es Skripte, die Tools über ihre eigene Konfiguration testen. \u003ccode>scripts/test_new_tools.py\u003c/code> ruft\njedes passende Tool mit seinen \u003ccode>test_examples\u003c/code> auf, zählt 404-Fehler gesondert und prüft die Antwort gegen\n\u003ccode>return_schema\u003c/code> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 3–9 und 247–248.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 3–9 und 247–248\u003c/a>)\u003c/span>; ein Muster grenzt auf Dateien oder Tool-Namen ein, etwa \u003ccode>fda\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 11–18.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 11–18\u003c/a>)\u003c/span> Eine Abweichung\nvom Schema meldet es als „Schema Mismatch“, der Exit-Code bleibt davon unberührt; die Ausgabe gehört also\ngelesen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 436–462 und 568–569.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 436–462 und 568–569\u003c/a>)\u003c/span>.\n\u003ccode>scripts/test_all_tools.py\u003c/code> läuft laut seiner README über alle Konfigurationen, gruppiert nach Präfix, und\nschreibt einen Bericht \u003ccode>TOOL_TEST_REPORT.md\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"README_TEST_ALL_TOOLS.md, Zeile 5–11 und 115–117.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 5–11 und 115–117\u003c/a>)\u003c/span>\u003c/p>\n\u003cp>Einmal in der Woche, montags um 06:00 UTC, läuft diese Prüfung in acht Teilen gegen die echten APIs; sie ist als\nFrühwarnung gedacht und lässt den Workflow bei Tool-Fehlern nicht scheitern \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"weekly-tool-healthcheck.yml, Zeile 3–22 und 38.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 3–22 und 38\u003c/a>)\u003c/span>. Remote- und MCP-Tools lässt\nsie aus \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"weekly-tool-healthcheck.yml, Zeile 104–105.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 104–105\u003c/a>)\u003c/span>. Was aus bekannten Gründen\nausfällt (Dienst gestört, Abruflimit, fehlendes Paket), steht in einer Liste; auffällig ist alles, was dort\nfehlt \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"known_failing_categories.txt, Zeile 1–32.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 1–32\u003c/a>)\u003c/span>.\u003c/p>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die README der \u003ca data-page=\"sources/tu-tool-test-scripts\" href=\"#sources/tu-tool-test-scripts\">Tool-Testskripte\u003c/a> rät, neue Tools „mit\nBericht“ zu committen und \u003ccode>TOOL_TEST_REPORT.md\u003c/code> zu versionieren \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"README_TEST_ALL_TOOLS.md, Zeile 327–333 und 390–397.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 327–333 und 390–397\u003c/a>)\u003c/span>; der Pre-Push-Hook in\n\u003ca data-page=\"sources/tu-skills-and-githooks\" href=\"#sources/tu-skills-and-githooks\">Skills und Git-Hooks\u003c/a> weist Markdown-Dateien mit \u003ccode>_REPORT\u003c/code> im Namen im\nWurzelordner ab. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"pre-push, Zeile 9–20.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 9–20\u003c/a>)\u003c/span>\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout todo\" id=\"offen-2\">\n\u003cp>\u003ccode>scripts/test_all_tools.py\u003c/code> selbst gehört nicht zu den Quellen; was hier dazu steht, stammt aus seiner\nREADME.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Neben pytest gibt es Skripte, die Tools über ihre eigene Konfiguration testen. scripts/test_new_tools.py ruft jedes passende Tool mit seinen test_examples auf, zählt 404-Fehler gesondert und prüft die Antwort gegen return_schema (mims-harvard, 2026i, Zeile 3–9 und 247–248); ein Muster grenzt auf Dateien oder …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}, {"key": "tu-tool-test-scripts", "page": "sources/tu-tool-test-scripts", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026i). \u003cem>Tool test scripts and weekly health check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 8}, {"key": "tu-skills-and-githooks", "page": "sources/tu-skills-and-githooks", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026j). \u003cem>ToolUniverse Skills (README), Git hooks and skill call check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 9}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Die README der Tool-Testskripte rät, neue Tools „mit Bericht“ zu committen und TOOL_TEST_REPORT.md zu versionieren (mims-harvard, 2026i, Zeile 327–333 und 390–397); der Pre-Push-Hook in Skills und Git-Hooks weist …"}, {"kind": "todo", "id": "offen-2", "text": "scripts/test_all_tools.py selbst gehört nicht zu den Quellen; was hier dazu steht, stammt aus seiner README."}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "entities/pre-commit", "title": "pre-commit", "type": "entity", "description": "Rahmenwerk für Git-Hooks; führt in ToolUniverse vor jedem Commit Datei-Prüfungen und Ruff aus.", "access": "", "in": 5, "out": 5, "domain": [], "subtype": "tool", "subfield": "category", "tags": [], "aliases": ["pre-commit-Hooks", "setup_precommit.sh"], "cite": "", "ris": "", "heading": "pre-commit", "html": "\u003cp>pre-commit verwaltet die Git-Hooks, die vor jedem Commit laufen. Eingerichtet wird es mit\n\u003ccode>./setup_precommit.sh\u003c/code> oder von Hand mit \u003ccode>pre-commit install\u003c/code> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 33–53.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 33–53\u003c/a>)\u003c/span>; das Skript installiert pre-commit bei\nBedarf mit \u003ccode>pip\u003c/code>, und von Hand laufen alle Hooks mit \u003ccode>pre-commit run --all-files\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\"setup_precommit.sh, Zeile 23–40.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 23–40\u003c/a>)\u003c/span> Der Hook in\n\u003ccode>.githooks/pre-commit\u003c/code> ist von pre-commit selbst erzeugt \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\"pre-commit, Zeile 2–7.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 2–7\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>Die Konfiguration in \u003ccode>.pre-commit-config.yaml\u003c/code> enthält Prüfungen auf Dateiende, Leerzeichen am Zeilenende,\nYAML- und TOML-Syntax sowie \u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 10–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 10–26\u003c/a>)\u003c/span>, und sie gilt nur für Dateien unter\n\u003ccode>src/tooluniverse/\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 1.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 1\u003c/a>)\u003c/span>\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "pre-commit verwaltet die Git-Hooks, die vor jedem Commit laufen. Eingerichtet wird es mit ./setup_precommit.sh oder von Hand mit pre-commit install (mims-harvard, 2026a, Zeile 33–53); das Skript installiert pre-commit bei Bedarf mit pip, und von Hand laufen alle Hooks mit pre-commit run --all-files. (mims-harvard …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-pre-commit", "page": "sources/tu-pre-commit", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026c). \u003cem>Pre-commit configuration and setup script\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 2}], "apa": null, "open": [], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "entities/pytest", "title": "pytest", "type": "entity", "description": "Testrahmen von ToolUniverse; was ein Aufruf sammelt, legen pytest.ini und die Marker fest.", "access": "", "in": 4, "out": 5, "domain": [], "subtype": "tool", "subfield": "category", "tags": [], "aliases": ["pytest.ini"], "cite": "", "ris": "", "heading": "pytest", "html": "\u003cp>Die Tests von ToolUniverse laufen mit pytest; der allgemeine Leitfaden nennt \u003ccode>pytest\u003c/code> für die schnelle\nStandardauswahl und \u003ccode>pytest tests/integration\u003c/code> für Integrationstests \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 116–126.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 116–126\u003c/a>)\u003c/span>. Was ein Aufruf ohne Argumente\nsammelt, steht in \u003ccode>pytest.ini\u003c/code>: Ordner, ausgeschlossene Marker, Abdeckung und \u003ccode>--strict-markers\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"pytest.ini, Zeile 3–10.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–10\u003c/a>)\u003c/span> Die CI\nruft pytest für Unit- und Integrationstests parallel auf \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 185–200.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 185–200\u003c/a>)\u003c/span>, und die PR-Vorlage fragt nach bestandenen\nTests für die betroffenen Bereiche \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 8.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 8\u003c/a>)\u003c/span>.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Die Tests von ToolUniverse laufen mit pytest; der allgemeine Leitfaden nennt pytest für die schnelle Standardauswahl und pytest tests/integration für Integrationstests (mims-harvard, 2026a, Zeile 116–126). Was ein Aufruf ohne Argumente sammelt, steht in pytest.ini: Ordner, ausgeschlossene Marker, Abdeckung und …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-pr-template", "page": "sources/tu-pr-template", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026d, Oktober 24). \u003cem>Pull request template\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\u003c/a>", "access": "fulltext", "order": 3}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}], "apa": null, "open": [], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "entities/ruff", "title": "Ruff", "type": "entity", "description": "Linter und Formatierer für Python; in ToolUniverse vor dem Commit über pre-commit und in der CI.", "access": "", "in": 8, "out": 7, "domain": [], "subtype": "tool", "subfield": "category", "tags": [], "aliases": ["ruff check", "ruff format"], "cite": "", "ris": "", "heading": "Ruff", "html": "\u003cp>Ruff formatiert und prüft den Code von ToolUniverse: \u003ccode>ruff format\u003c/code> und \u003ccode>ruff check\u003c/code> über \u003ccode>src/tooluniverse/\u003c/code>\nund \u003ccode>tests/\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 71–88.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 71–88\u003c/a>)\u003c/span> Vor jedem Commit laufen \u003ccode>ruff-check --fix\u003c/code> und \u003ccode>ruff-format\u003c/code> über\n\u003ca data-page=\"entities/pre-commit\" href=\"#entities/pre-commit\">pre-commit\u003c/a>, festgelegt auf ruff-pre-commit v0.14.7 \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 19–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 19–26\u003c/a>)\u003c/span>; die CI prüft mit der\nRuff-Action in Version 0.15.22 \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 130–133.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 130–133\u003c/a>)\u003c/span>. Die PR-Vorlage fragt nach bestandenem \u003ccode>ruff check\u003c/code> für die geänderten\nPython-Dateien \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 7.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 7\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp id=\"offen-1\">\u003cstrong>Zu prüfen:\u003c/strong> Lokal und in der CI laufen verschiedene Ruff-Versionen (v0.14.7 und 0.15.22) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 19–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 19–26\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 130–133.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 130–133\u003c/a>)\u003c/span>.\nOb sich ihre Regeln oder die Formatierung unterscheiden, sagen die Quellen nicht.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Ruff formatiert und prüft den Code von ToolUniverse: ruff format und ruff check über src/tooluniverse/ und tests/. (mims-harvard, 2026a, Zeile 71–88) Vor jedem Commit laufen ruff-check --fix und ruff-format über pre-commit, festgelegt auf ruff-pre-commit v0.14.7 (mims-harvard, 2026c, Zeile 19–26); die CI prüft mit der …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-pre-commit", "page": "sources/tu-pre-commit", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026c). \u003cem>Pre-commit configuration and setup script\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 2}, {"key": "tu-pr-template", "page": "sources/tu-pr-template", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026d, Oktober 24). \u003cem>Pull request template\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\u003c/a>", "access": "fulltext", "order": 3}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}], "apa": null, "open": [{"kind": "check", "id": "offen-1", "text": "Zu prüfen: Lokal und in der CI laufen verschiedene Ruff-Versionen (v0.14.7 und 0.15.22) (mims-harvard, 2026c, Zeile 19–26; mims-harvard, 2026f, Zeile 130–133). Ob sich ihre Regeln oder die Formatierung unterscheiden …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "entities/tooluniverse", "title": "ToolUniverse", "type": "entity", "description": "Ökosystem, über das Sprachmodelle wissenschaftliche Tools finden und aufrufen; Python-Paket, MCP-Server, CLI und Agent-Skills.", "access": "", "in": 3, "out": 9, "domain": [], "subtype": "project", "subfield": "category", "tags": ["einstieg"], "aliases": ["mims-harvard/ToolUniverse"], "cite": "", "ris": "", "heading": "ToolUniverse", "html": "\u003cp>ToolUniverse ist ein Ökosystem, um aus einem Sprachmodell ein KI-Wissenschaftssystem zu bauen: Es legt über das\nAI-Tool Interaction Protocol fest, wie Modelle Tools finden und aufrufen, und bindet nach eigener Angabe mehr\nals 1000 ML-Modelle, Datensätze, APIs und wissenschaftliche Pakete ein \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-readme\" title=\"README.md, Zeile 88.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026k, Zeile 88\u003c/a>)\u003c/span>. Genutzt wird es als\nMCP-Server, über die CLI \u003ccode>tu\u003c/code>, als Python-SDK und mit Agent-Skills \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-readme\" title=\"README.md, Zeile 62–74 und 94–99.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026k, Zeile 62–74 und 94–99\u003c/a>)\u003c/span>. Es läuft lokal und sammelt\nkeine Telemetrie \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-readme\" title=\"README.md, Zeile 147–154.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026k, Zeile 147–154\u003c/a>)\u003c/span>.\u003c/p>\n\u003ch2>Woran man beitragen kann\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Tools\u003c/strong>, lokal als Python-Klasse im Paket oder als Dienst auf eigenem Server: \u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\n  und \u003ca data-page=\"concepts/remote-tool\" href=\"#concepts/remote-tool\">Remote-Tool\u003c/a> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"index.rst, Zeile 41–74.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 41–74\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003cstrong>Skills\u003c/strong>, also Forschungs-Workflows für Agenten: \u003ca data-page=\"concepts/skills-beitragen\" href=\"#concepts/skills-beitragen\">Agent-Skills beitragen\u003c/a> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"README.md der Skills, Zeile 3.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 3\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003cstrong>Fehlerberichte, Funktionswünsche und Doku\u003c/strong>, die der allgemeine Leitfaden als eigene Beitragsarten\n  nennt \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 291–362.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 291–362\u003c/a>)\u003c/span>.\u003c/li>\n\u003c/ul>\n\u003ch2>Einstieg\u003c/h2>\n\u003cp>Zuerst die \u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>; den ganzen Weg zu einem neuen\nTool beschreibt \u003ca data-page=\"syntheses/erster-tool-beitrag\" href=\"#syntheses/erster-tool-beitrag\">Der Weg zum ersten Tool-Beitrag\u003c/a>.\u003c/p>", "excerpt": "ToolUniverse ist ein Ökosystem, um aus einem Sprachmodell ein KI-Wissenschaftssystem zu bauen: Es legt über das AI-Tool Interaction Protocol fest, wie Modelle Tools finden und aufrufen, und bindet nach eigener Angabe mehr als 1000 ML-Modelle, Datensätze, APIs und wissenschaftliche Pakete ein (mims-harvard, 2026k …", "outline": ["Woran man beitragen kann", "Einstieg"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "access": "fulltext", "order": 1}, {"key": "tu-skills-and-githooks", "page": "sources/tu-skills-and-githooks", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026j). \u003cem>ToolUniverse Skills (README), Git hooks and skill call check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 9}, {"key": "tu-readme", "page": "sources/tu-readme", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026k, Oktober 24). \u003cem>ToolUniverse: Democratizing AI scientists (README)\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\u003c/a>", "access": "fulltext", "order": 10}], "apa": null, "open": [], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-adding-tools-quickref", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-adding-tools-quickref", "title": "Quick Reference – Adding Tools; Tool Generation Guide", "type": "source", "description": "Kurzreferenz zum Hinzufügen eines Tools und Anleitung zu build_tools.py, das Tool-Code aus den Konfigurationen erzeugt.", "access": "fulltext", "in": 8, "out": 8, "domain": [], "subtype": "documentation", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026e", "ris": "TY  - ELEC\r\nAU  - mims-harvard\r\nTI  - Quick Reference – Adding Tools; Tool Generation Guide\r\nT2  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Quick Reference – Adding Tools; Tool Generation Guide", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Die Kurzreferenz zeigt ein Tool in einer einzigen Datei mit Konfiguration im Dekorator, gängige Muster,\nKonfigurationsvorlagen, typische Fehler und eine Prüfliste. Die Anleitung zu \u003ccode>scripts/build_tools.py\u003c/code>\nerklärt, wie das Skript geänderte Tool-Konfigurationen erkennt und nur deren Code neu erzeugt.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Ein Tool ist eine Klasse mit \u003ccode>__init__(self, tool_config=None)\u003c/code> und \u003ccode>run(self, arguments)\u003c/code>; beides gilt als\n  Pflicht (Adding_Tools_Quick_Reference.md, Zeile 21–26, 121–129).\u003c/li>\n\u003cli>Die Konfiguration braucht \u003ccode>name\u003c/code>, \u003ccode>type\u003c/code>, \u003ccode>description\u003c/code> und \u003ccode>parameter\u003c/code> (Zeile 154); Rückgaben sollen\n  einheitlich \u003ccode>success: True/False\u003c/code> tragen (Zeile 155).\u003c/li>\n\u003cli>Zum Ausprobieren: \u003ccode>tu.load_tools()\u003c/code>, dann \u003ccode>tu.run_one_function({...})\u003c/code> (Zeile 28–32, 157–164).\u003c/li>\n\u003cli>\u003ccode>build_tools.py\u003c/code> bildet je Tool-Konfiguration einen MD5-Hash ohne Zeitstempelfelder, speichert ihn in\n  \u003ccode>src/tooluniverse/tools/.tool_metadata.json\u003c/code> und erzeugt nur neue und geänderte Tools neu\n  (BUILD_TOOLS_GUIDE.md, Zeile 5–23); \u003ccode>--force\u003c/code> oder \u003ccode>TOOLUNIVERSE_FORCE_REGENERATE=1\u003c/code> erzeugt alle neu\n  (Zeile 44–54).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die Kurzreferenz legt die Tool-Datei in \u003ccode>src/tooluniverse/\u003c/code> ab und übergibt die\nKonfiguration im Dekorator (Zeile 5–20); der Leitfaden für Beiträge in\n\u003ca data-page=\"sources/tu-expand-contributing\" href=\"#sources/tu-expand-contributing\">Expand ToolUniverse\u003c/a> verlangt für beigetragene Tools eine eigene\nJSON-Datei in \u003ccode>data/\u003c/code>.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-2\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Nach der Prüfliste muss die Datei auf \u003ccode>_tool.py\u003c/code> enden, und die Fehlertabelle nennt die\nEndung als Ursache, wenn ein Tool nicht gefunden wird (Zeile 150, 170); nach dem\n\u003ca data-page=\"sources/tu-tool-registry-code\" href=\"#sources/tu-tool-registry-code\">Quellcode der Registrierung\u003c/a> findet die Lazy-Suche (Standard) dekorierte\nKlassen auch in anderen Python-Dateien des Pakets, nur die vollständige Erkennung lädt allein Module mit\n\u003ccode>_tool\u003c/code> im Namen.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-3\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die Kurzreferenz verlangt \u003ccode>success: True/False\u003c/code> als einheitliches Format (Zeile 155);\nder \u003ca data-page=\"sources/tu-test-writing-guide\" href=\"#sources/tu-test-writing-guide\">Leitfaden für Tests\u003c/a> geht von einem Feld \u003ccode>status\u003c/code> in jeder Antwort\naus, und das \u003ca data-page=\"sources/tu-tool-test-scripts\" href=\"#sources/tu-tool-test-scripts\">Testskript\u003c/a> führt \u003ccode>success\u003c/code> als alten Stil.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Schnell zu lesen, für einen Beitrag aber nur zusammen mit dem Leitfaden und dem Code; die Anleitung zu\n\u003ccode>build_tools.py\u003c/code> erklärt einen der Generatoren, die die CI verlangt.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-adding-tools-quickref\u003c/code> (\u003ccode>docs/dev_docs/Adding_Tools_Quick_Reference.md\u003c/code>,\n\u003ccode>scripts/BUILD_TOOLS_GUIDE.md\u003c/code>), unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Die Kurzreferenz zeigt ein Tool in einer einzigen Datei mit Konfiguration im Dekorator, gängige Muster, Konfigurationsvorlagen, typische Fehler und eine Prüfliste. Die Anleitung zu scripts/build_tools.py erklärt, wie das Skript geänderte Tool-Konfigurationen erkennt und nur deren Code neu erzeugt.", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026e, Oktober 24). \u003cem>Quick Reference – Adding Tools; Tool Generation Guide\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Die Kurzreferenz legt die Tool-Datei in src/tooluniverse/ ab und übergibt die Konfiguration im Dekorator (Zeile 5–20); der Leitfaden für Beiträge in Expand ToolUniverse verlangt für beigetragene Tools eine eigene …"}, {"kind": "contra", "id": "offen-2", "text": "Nach der Prüfliste muss die Datei auf _tool.py enden, und die Fehlertabelle nennt die Endung als Ursache, wenn ein Tool nicht gefunden wird (Zeile 150, 170); nach dem Quellcode der Registrierung findet die Lazy-Suche …"}, {"kind": "contra", "id": "offen-3", "text": "Die Kurzreferenz verlangt success: True/False als einheitliches Format (Zeile 155); der Leitfaden für Tests geht von einem Feld status in jeder Antwort aus, und das Testskript führt success als alten Stil."}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-contributing-guide", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-contributing-guide", "title": "Contributing to ToolUniverse", "type": "source", "description": "Allgemeiner Beitragsleitfaden der Doku mit Einrichtung, Code-Standards, Tests, Doku, Ablauf und Review.", "access": "fulltext", "in": 7, "out": 6, "domain": [], "subtype": "documentation", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026a", "ris": "TY  - ELEC\r\nAU  - mims-harvard\r\nTI  - Contributing to ToolUniverse\r\nT2  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Contributing to ToolUniverse", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Der Leitfaden unter „About“ beschreibt den allgemeinen Rahmen für jeden Beitrag: Entwicklungsumgebung,\nCode-Standards, Tests, Doku, den Ablauf vom Branch bis zum Pull Request, Arten von Beiträgen und das Review.\nFür Tool-Beiträge im Einzelnen gibt es eigene Leitfäden unter „Expand ToolUniverse“.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Einrichtung: Fork, Klon, virtuelle Umgebung mit \u003ccode>python -m venv .venv\u003c/code>, Installation mit\n  \u003ccode>python -m pip install -e \".[dev]\"\u003c/code> (Zeile 12–31), dann pre-commit, am einfachsten mit \u003ccode>./setup_precommit.sh\u003c/code>\n  (Zeile 33–53).\u003c/li>\n\u003cli>Zur Entwicklungsumgebung gehören pytest, Ruff, Sphinx und pre-commit (Zeile 58–63).\u003c/li>\n\u003cli>Formatieren und prüfen mit \u003ccode>ruff format\u003c/code> und \u003ccode>ruff check\u003c/code> über \u003ccode>src/tooluniverse/\u003c/code> und \u003ccode>tests/\u003c/code>\n  (Zeile 71–88); neuer Code trägt Typannotationen (Zeile 93).\u003c/li>\n\u003cli>Tests mit \u003ccode>pytest\u003c/code>, Integrationstests bei Bedarf über \u003ccode>pytest tests/integration\u003c/code> (Zeile 116–126); Ziel ist\n  eine Abdeckung über 90 % (Zeile 169). Docstrings im Google-Stil (Zeile 209).\u003c/li>\n\u003cli>Ablauf: Feature-Branch, Commit-Nachrichten nach Conventional Commits mit den Typen \u003ccode>feat\u003c/code>, \u003ccode>fix\u003c/code>, \u003ccode>docs\u003c/code>,\n  \u003ccode>test\u003c/code>, \u003ccode>refactor\u003c/code>, \u003ccode>style\u003c/code>, \u003ccode>chore\u003c/code> (Zeile 239–276), dann Push und Pull Request mit Beschreibung und\n  verknüpften Issues (Zeile 278–289).\u003c/li>\n\u003cli>Für neue wissenschaftliche Tools: Datenquelle gründlich prüfen, einheitliche API, Fehlerbehandlung, Tests,\n  Doku und Beispiele (Zeile 315–324).\u003c/li>\n\u003cli>Beim Review prüft laut Leitfaden zuerst die CI Tests, Linting und Typen; dann sehen Maintainer Codequalität und\n  Design durch, außerdem werden Doku und Funktion geprüft (Zeile 364–372).\u003c/li>\n\u003c/ul>\n\u003cp id=\"offen-1\">\u003cstrong>Zu prüfen:\u003c/strong> Der Leitfaden nennt eine Typprüfung in der CI (Zeile 369); der Workflow \u003ccode>tests.yml\u003c/code> in\n\u003ca data-page=\"sources/tu-tests-and-ci\" href=\"#sources/tu-tests-and-ci\">Testsuite und CI\u003c/a> führt Ruff und pytest aus, aber keinen Typprüfer.\u003c/p>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Rahmen für Commit-Nachrichten, Code-Stil und Review; bei der Einrichtung weicht er vom README ab, das\n\u003ccode>uv\u003c/code> empfiehlt.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a>, \u003ca data-page=\"entities/pre-commit\" href=\"#entities/pre-commit\">pre-commit\u003c/a>, \u003ca data-page=\"entities/pytest\" href=\"#entities/pytest\">pytest\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-contributing-guide\u003c/code>, unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Der Leitfaden unter „About“ beschreibt den allgemeinen Rahmen für jeden Beitrag: Entwicklungsumgebung, Code-Standards, Tests, Doku, den Ablauf vom Branch bis zum Pull Request, Arten von Beiträgen und das Review. Für Tool-Beiträge im Einzelnen gibt es eigene Leitfäden unter „Expand ToolUniverse“.", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "open": [{"kind": "check", "id": "offen-1", "text": "Zu prüfen: Der Leitfaden nennt eine Typprüfung in der CI (Zeile 369); der Workflow tests.yml in Testsuite und CI führt Ruff und pytest aus, aber keinen Typprüfer."}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-expand-contributing", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-expand-contributing", "title": "Expand ToolUniverse: Contributing local and remote tools", "type": "source", "description": "Übersicht „Expand ToolUniverse“, Entscheidungstabelle und die Leitfäden in zehn Schritten für lokale und Remote-Tools.", "access": "fulltext", "in": 11, "out": 8, "domain": [], "subtype": "documentation", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026b", "ris": "TY  - ELEC\r\nAU  - mims-harvard\r\nTI  - Expand ToolUniverse: Contributing local and remote tools\r\nT2  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Expand ToolUniverse: Contributing local and remote tools", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Vier Seiten der Doku führen zum eigenen Tool: die Übersicht „Expand ToolUniverse“ (\u003ccode>index.rst\u003c/code>), eine\nEntscheidungstabelle zwischen lokalen und Remote-Tools (\u003ccode>contributing-index.rst\u003c/code>) und je ein Leitfaden in\nzehn Schritten für Beiträge lokaler (\u003ccode>local_tools.rst\u003c/code>) und entfernter Tools (\u003ccode>remote_tools.rst\u003c/code>).\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Lokale Tools sind Python-Klassen im Prozess von ToolUniverse, ohne Netzwerk-Overhead, und registrieren sich\n  über Dekoratoren (index.rst, Zeile 41–54); Remote-Tools laufen auf eigenen Servern, auch in anderen\n  Sprachen (index.rst, Zeile 58–72; contributing-index.rst, Zeile 13–30).\u003c/li>\n\u003cli>Für einen Remote-Beitrag braucht es einen öffentlich erreichbaren Server oder eine ausführliche Anleitung zur\n  Bereitstellung (index.rst, Zeile 74; remote_tools.rst, Zeile 7).\u003c/li>\n\u003cli>Ein beigetragenes lokales Tool besteht aus einer Klasse in \u003ccode>src/tooluniverse/\u003c/code> mit \u003ccode>@register_tool('Typ')\u003c/code>,\n  ohne Konfiguration im Dekorator, und einer JSON-Spezifikation in \u003ccode>src/tooluniverse/data/\u003c/code>\n  (local_tools.rst, Zeile 50–61, 80–83, 102–105).\u003c/li>\n\u003cli>Nur \u003ccode>tool_config_files\u003c/code> zu übergeben lädt die JSON-Spezifikation, importiert aber keine Python-Datei\n  außerhalb des Pakets (local_tools.rst, Zeile 98–100).\u003c/li>\n\u003cli>Remote-Tools: Konfiguration in \u003ccode>data/remote_tools/\u003c/code> mit Typ \u003ccode>RemoteTool\u003c/code> und \u003ccode>remote_info\u003c/code> (Servertyp,\n  Transport, URL, Code-URL) (remote_tools.rst, Zeile 125–158), Integrationstests gegen einen gemockten Server\n  (remote_tools.rst, Zeile 19, 223–226).\u003c/li>\n\u003cli>Häufigster Fehler laut Leitfaden: ein fehlender \u003ccode>@register_tool\u003c/code>-Dekorator (local_tools.rst, Zeile 357–359).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Der Leitfaden für lokale Tools nennt das Ändern von \u003ccode>__init__.py\u003c/code> an vier Stellen den\nwichtigsten Schritt (local_tools.rst, Zeile 7; ebenso index.rst, Zeile 56, contributing-index.rst, Zeile 23,\nund die PR-Vorlage im Leitfaden, Zeile 337 und 351) und sagt in Schritt 5, dass \u003ccode>__init__.py\u003c/code> nicht geändert\nwerden muss (Zeile 136–141). Der \u003ca data-page=\"sources/tu-tool-registry-code\" href=\"#sources/tu-tool-registry-code\">Quellcode der Registrierung\u003c/a> stützt\nSchritt 5.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-2\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Schritt 7 kündigt für den Commit Black, Flake8 und Ruff an (local_tools.rst, Zeile 197;\nremote_tools.rst, Zeile 306); die \u003ca data-page=\"sources/tu-pre-commit\" href=\"#sources/tu-pre-commit\">pre-commit-Konfiguration\u003c/a> enthält von diesen\nnur Ruff.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-3\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Hier gehört die Konfiguration eines beigetragenen Tools in eine JSON-Datei, nicht in\nden Dekorator (local_tools.rst, Zeile 83, 361–363); die \u003ca data-page=\"sources/tu-adding-tools-quickref\" href=\"#sources/tu-adding-tools-quickref\">Kurzreferenz\u003c/a>\nlegt die Datei in \u003ccode>src/tooluniverse/\u003c/code> ab und übergibt die Konfiguration im Dekorator.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-4\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die Übersicht der zehn Schritte nennt Unit-Tests optional (local_tools.rst, Zeile 21);\nderselbe Leitfaden verlangt mehr als 90 % Abdeckung (Zeile 370–372), ebenso die Vergleichstabelle\n(contributing-index.rst, Zeile 25–26).\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Hauptquelle für einen Tool-Beitrag, aber in mehreren Punkten älter als Code und Konfiguration.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>, \u003ca data-page=\"concepts/remote-tool\" href=\"#concepts/remote-tool\">Remote-Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-expand-contributing\u003c/code> (vier Dateien), unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>,\nApache-2.0. \u003ccode>index.rst\u003c/code> ist \u003ccode>docs/expand_tooluniverse/index.rst\u003c/code>, \u003ccode>contributing-index.rst\u003c/code> ist\n\u003ccode>docs/expand_tooluniverse/contributing/index.rst\u003c/code>.\u003c/p>", "excerpt": "Vier Seiten der Doku führen zum eigenen Tool: die Übersicht „Expand ToolUniverse“ (index.rst), eine Entscheidungstabelle zwischen lokalen und Remote-Tools (contributing-index.rst) und je ein Leitfaden in zehn Schritten für Beiträge lokaler (local_tools.rst) und entfernter Tools (remote_tools.rst).", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Der Leitfaden für lokale Tools nennt das Ändern von __init__.py an vier Stellen den wichtigsten Schritt (local_tools.rst, Zeile 7; ebenso index.rst, Zeile 56, contributing-index.rst, Zeile 23, und die PR-Vorlage im …"}, {"kind": "contra", "id": "offen-2", "text": "Schritt 7 kündigt für den Commit Black, Flake8 und Ruff an (local_tools.rst, Zeile 197; remote_tools.rst, Zeile 306); die pre-commit-Konfiguration enthält von diesen nur Ruff."}, {"kind": "contra", "id": "offen-3", "text": "Hier gehört die Konfiguration eines beigetragenen Tools in eine JSON-Datei, nicht in den Dekorator (local_tools.rst, Zeile 83, 361–363); die Kurzreferenz legt die Datei in src/tooluniverse/ ab und übergibt die …"}, {"kind": "contra", "id": "offen-4", "text": "Die Übersicht der zehn Schritte nennt Unit-Tests optional (local_tools.rst, Zeile 21); derselbe Leitfaden verlangt mehr als 90 % Abdeckung (Zeile 370–372), ebenso die Vergleichstabelle (contributing-index.rst, Zeile …"}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-pr-template", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-pr-template", "title": "Pull request template", "type": "source", "description": "Vorlage für Pull Requests mit Zusammenfassung, vier Prüfpunkten zur Validierung und vier zur Sorgfalt.", "access": "fulltext", "in": 6, "out": 3, "domain": [], "subtype": "documentation", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026d", "ris": "TY  - ELEC\r\nAU  - mims-harvard\r\nTI  - Pull request template\r\nT2  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Pull request template", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Die Vorlage für Pull Requests hat drei Teile: eine Zusammenfassung, vier Prüfpunkte zur Validierung und eine\nPrüfliste mit vier Punkten.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Validierung: \u003ccode>ruff check\u003c/code> für die geänderten Python-Dateien, \u003ccode>pytest\u003c/code> für die betroffenen Unit- und\n  Integrationstests, neu erzeugte SDK- und Tool-Dateien, wenn sich Tool-Metadaten geändert haben, und Tests\n  mit Netz oder API-Schlüssel markiert oder von den Standardprüfungen getrennt (Zeile 5–10).\u003c/li>\n\u003cli>Prüfliste: Issue verknüpft oder Problem beschrieben, Doku, Beispiele oder Tool-Metadaten bei geändertem\n  Verhalten aktualisiert, Tests für neue Tools, Provider oder Schemas, keine Zugangsdaten, zwischengespeicherten\n  API-Antworten oder großen erzeugten Artefakte im Commit (Zeile 12–17).\u003c/li>\n\u003c/ul>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Zeigt, was beim Review abgehakt wird, und ist damit die kürzeste Prüfliste für einen Beitrag.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"analyses/checkliste-vor-dem-pr\" href=\"#analyses/checkliste-vor-dem-pr\">Prüfliste vor dem Pull Request\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-pr-template\u003c/code>, unverän
