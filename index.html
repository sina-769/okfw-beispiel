/* Gestaltung: Alabaster-Grund, weiße Karten, Charcoal,
   Akzent Gelb (dunkel: Blau), IBM Plex Serif/Sans, JetBrains Mono. Datenfarben: validierte Palette
   (vier Farben bestehen den Validator für Netzdiagramme, weitere Werte erscheinen grau). */
:root {
  color-scheme: light;
  --font-heading: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --page: #F4F3ED; --surface: #FFFFFF; --ink: #1A1A1A; --ink-2: rgba(26, 26, 26, 0.75); --muted: rgba(26, 26, 26, 0.65);
  --grid: rgba(26, 26, 26, 0.10); --border: rgba(26, 26, 26, 0.10);
  --accent: #FCE53A; --accent-hover: #E6CE34; --on-accent: #1A1A1A;
  --c1: #2a78d6; --c2: #008300; --c3: #eda100; --c4: #e87ba4; --c-other: #898781;
  --warning: #fab219;
  --edge: rgba(26, 26, 26, 0.14); --edge-hi: rgba(26, 26, 26, 0.7); --wash: rgba(26, 26, 26, 0.05);
  --shadow: rgba(0, 0, 0, 0.18);
  --code-bg: rgba(26, 26, 26, 0.08); --pre-bg: #1A1A1A; --pre-ink: #e5e5e5;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1F1F1F; --surface: #161616; --ink: #E5E2D9; --ink-2: rgba(229, 226, 217, 0.75); --muted: rgba(229, 226, 217, 0.62);
  --grid: rgba(229, 226, 217, 0.10); --border: rgba(229, 226, 217, 0.12);
  --accent: #3a5efc; --accent-hover: #2d4fdb; --on-accent: #FFFFFF;
  --c1: #3987e5; --c2: #008300; --c3: #c98500; --c4: #d55181; --c-other: #898781;
  --edge: rgba(229, 226, 217, 0.13); --edge-hi: rgba(229, 226, 217, 0.75); --wash: rgba(229, 226, 217, 0.06);
  --shadow: rgba(0, 0, 0, 0.55);
  --code-bg: rgba(229, 226, 217, 0.10); --pre-bg: #252525; --pre-ink: #e5e5e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.5 var(--font-body); }
main { max-width: 1440px; margin: 0 auto; padding: 16px; }
h1 { font-family: var(--font-heading); font-size: 26px; font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-heading); font-size: 18px; font-weight: 400; margin: 0 0 10px; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--ink-2); }
.hl { background: linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--accent) 30%, transparent) 65%, var(--accent) 95%); }
a { color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); text-decoration-thickness: 2.5px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-width: 0; }
.pad { padding: 14px 16px; }
.btn-primary { background: var(--accent); color: var(--on-accent); border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-primary:hover { background: var(--accent-hover); }
.ghost { border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.ghost:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.linkish { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; font: inherit; }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; font: 11px var(--font-mono); letter-spacing: 0.02em; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); color: var(--ink-2); background: transparent; }
button.tag { cursor: pointer; }
button.tag:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 8px; overflow: hidden; }
.segb { border: 0; background: transparent; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.segb + .segb { border-left: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); }
.segb[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
.tile { padding: 12px 14px; }
.tile .l { color: var(--ink-2); font-size: 12px; }
.tile .v { font-size: 26px; font-weight: 600; line-height: 1.25; }
.tile .s { color: var(--muted); font-size: 12px; }

.netz { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; margin-bottom: 12px; }
.netz.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 960px) { .netz { grid-template-columns: minmax(0, 1fr); } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chip:hover { background: var(--wash); }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="false"] .lab { text-decoration: line-through; }
.chip .n { color: var(--muted); }
select, input[type="search"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
input[type="search"] { width: 14em; }
label.check { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--ink-2); }
.edgekey, .colorkey { font-size: 12px; color: var(--muted); display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.colorkey span { display: inline-flex; gap: 4px; align-items: center; }
.hitcount { font-size: 12px; color: var(--ink-2); }
.graphwrap { position: relative; }
#graph { width: 100%; height: min(72vh, 780px); min-height: 420px; display: block; cursor: grab; touch-action: none; user-select: none; }
#graph.panning { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { background: var(--surface); }
.edge { stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.edge.src { stroke-dasharray: 3 3; }
.edge.hi { stroke: var(--edge-hi); stroke-width: 1.5; }
.node { cursor: pointer; }
.node .dot { stroke: var(--surface); stroke-width: 1.5; vector-effect: non-scaling-stroke; filter: drop-shadow(0 1px 1.5px var(--shadow)); }
.node .dot.ring { stroke-width: 2.6; }
.node .halo { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; opacity: 0; }
.node .grab { fill: transparent; stroke: none; } /* Trefferfläche größer als der kleine Punkt */
.node.sel .halo, .node.hit .halo { opacity: 1; }
.node.dim, .edge.dim, .label.dim { opacity: 0.12; }
.label { fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; }

.cols[hidden], .seg[hidden] { display: none; }
.cols-bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--grid); }
.cols-scroll { max-height: calc(100vh - 80px); min-height: 560px; overflow: auto; } /* fast bildschirmhoch */
#colsvg { display: block; }
.chead { font-family: var(--font-heading); font-size: 15px; fill: var(--ink); }
.crow { cursor: pointer; }
.crow .bg { fill: var(--surface); stroke: var(--grid); stroke-width: 1; }
.crow:hover .bg, .crow:focus-visible .bg { fill: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.crow .t1 { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.crow .t2 { font-size: 11.5px; fill: var(--muted); }
.crow .dot { stroke: none; }
.crow .dot.ring { stroke-width: 2; }
.crow.sel .bg, .crow.hit .bg { stroke: var(--ink); stroke-width: 1.5; }
.crow.dim { opacity: 0.28; }
.cthread { fill: none; stroke: var(--edge); stroke-width: 1; }
.cthread.src { stroke-dasharray: 3 3; }
.cthread.hi { stroke: var(--edge-hi); stroke-width: 1.6; }
.cthread.dim { opacity: 0.12; }

/* Vorschaukarte (Hover, in der Spaltenansicht per Klick angeheftet) */
#tip { position: fixed; z-index: 15; pointer-events: none; width: min(360px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16); display: none; }
#tip.pinned { pointer-events: auto; width: min(580px, calc(100vw - 24px)); max-height: min(80vh, 780px); overflow-y: auto; overscroll-behavior: contain; padding: 0; }
.pv-bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--grid); font: 11px var(--font-mono); color: var(--muted); }
.pv-bar .sp { flex: 1; }
.pv-bar button { font-family: var(--font-body); }
.pv-inner { padding: 14px 18px 18px; }
.pv-inner .r-head { padding-bottom: 12px; margin-bottom: 14px; }
.pv-inner .r-head h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; }
.pv-inner .r-desc { font-size: 15px; }
.pv-inner .prose-content { font-size: 15px; line-height: 1.65; }
.pv-inner .prose-content h2 { font-size: 18px; margin: 24px 0 8px; }
.pv-inner .prose-content h3 { font-size: 16px; margin: 18px 0 6px; }
.pv-inner .prose-content p, .pv-inner .prose-content li { line-height: 1.65; }
.pv-inner .prose-content blockquote { padding: 10px 14px; margin: 14px 0; }
.pv-inner .r-section { margin-top: 20px; padding-top: 12px; }
.pv-inner .r-section h2 { font-size: 16px; }
.pv-inner .lit li { font-size: 13px; padding: 8px 0 8px 2em; }
.pv-inner .r-apa { font-size: 13px; }
.pv-kind { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font: 11px var(--font-mono); color: var(--muted); }
.pv-title { font-family: var(--font-heading); font-size: 17px; line-height: 1.3; margin: 6px 0; }
.pv-cite { font-size: 12px; color: var(--ink-2); margin: -2px 0 6px; }
.pv-desc { margin: 0 0 6px; }
.pv-ex { color: var(--ink-2); margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.pv-out { font-size: 12px; color: var(--muted); }
.pv-foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--grid); font-size: 11px; color: var(--muted); }

.panel { padding: 14px 16px; max-height: calc(min(72vh, 780px) + 54px); overflow: auto; }
.netz.wide .panel { max-height: none; }
.panel .empty { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--ink-2); font-size: 12px; margin: 6px 0 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.desc { margin: 0 0 10px; }
.excerpt { color: var(--ink-2); margin: 0 0 10px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { margin: 2px 0; }
.list button { border: 0; background: transparent; padding: 2px 4px; margin-left: -4px; border-radius: 4px; cursor: pointer; text-align: left; display: inline-flex; gap: 6px; align-items: center; }
.list button:hover { background: var(--wash); }
.kind { color: var(--muted); font-size: 11px; }
details > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
.panel details.links > summary { padding: 2px 0; margin: 14px 0 4px; font-size: 13px; color: var(--ink-2); }
.panel details.links[open] > summary { margin-bottom: 6px; }
.note { font-size: 12px; color: var(--muted); }


.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pages th { cursor: pointer; white-space: nowrap; }
.pages th[aria-sort="ascending"]::after { content: " ▲"; }
.pages th[aria-sort="descending"]::after { content: " ▼"; }
.pages tbody tr { cursor: pointer; }
.pages tbody tr:hover { background: var(--wash); }
.pages td .d { color: var(--muted); font-size: 12px; }
footer { color: var(--muted); font-size: 12px; margin: 16px 0 8px; }

/* Leseansicht (Aufbau wie ein Blogartikel) */
body.reading { overflow: hidden; }
.reader { position: fixed; inset: 0; z-index: 20; background: var(--page); overflow-y: auto; padding: 16px; }
.reader[hidden] { display: none; }
.reader-bar { max-width: 56rem; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reader-bar .sp { flex: 1; }
.r-card { max-width: 56rem; margin: 0 auto 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 20px; }
@media (min-width: 768px) { .r-card { padding: 44px 48px; } }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.r-head { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
.r-head h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.2; margin-bottom: 12px; }
.r-desc { font-size: 17px; color: var(--ink-2); margin: 0 0 12px; }
.r-meta { font: 12px var(--font-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.r-section { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; }
.r-section h2 { font-size: 18px; }
.r-section details > summary { padding: 4px 0; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.r-section details.r-fold > summary { padding: 0; font-weight: 400; color: var(--ink); }
.r-fold > summary h2 { display: inline; margin: 0; }
.r-fold[open] > summary { margin-bottom: 10px; }
.r-kicker { font: 13px var(--font-mono); color: var(--muted); margin-bottom: 8px; }
.metalink { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.metalink:hover { color: var(--ink); text-decoration-color: var(--accent); }
.rights { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 4px; }
.rights th, .rights td { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); }
.rights th { font-weight: 400; font-size: 14px; color: var(--ink); width: 42%; }
.r-note { color: var(--muted); font-size: 13px; }
.r-lic { margin: 0 0 6px; overflow-wrap: anywhere; }
.fundweg { list-style: none; padding: 0; margin: 0; }
.fundweg li { padding: 4px 0; overflow-wrap: anywhere; }
.fundweg code { font-family: var(--font-mono); font-size: 0.85em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.right { display: inline-block; white-space: nowrap; padding: 1px 8px; border-radius: 999px; font: 600 11px var(--font-mono); border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.right.r-ja { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.right.r-nein { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.right.r-fragen { background: color-mix(in srgb, var(--warning) 22%, transparent); }
.facet-list { list-style: none; padding: 0; margin: 8px 0 0; }
.facet-list li { padding: 9px 0; border-bottom: 1px solid var(--grid); }
.facet-list .linkish { font-size: 16px; line-height: 1.4; }
.fl-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.r-apa a { overflow-wrap: anywhere; }
.r-apa { overflow-wrap: anywhere; margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--ink); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 8px; font-size: 15px; color: var(--ink); }
.r-apa-l { font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.lit { list-style: none; padding: 0; margin: 12px 0 0; }
.lit li { padding: 10px 0 10px 2em; text-indent: -2em; border-bottom: 1px solid var(--grid); line-height: 1.6; color: var(--ink-2); }
.lit li:target { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.lit .lit-entry a { color: var(--ink); overflow-wrap: anywhere; }
.lit .lit-meta { display: inline-flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-left: 10px; text-indent: 0; vertical-align: 1px; }
.lit .lit-meta .linkish { font-size: 12px; color: var(--muted); }
.tag.citation { border-style: dashed; }
.tag.internal { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--ink); }

.prose-content { font-size: 17px; line-height: 1.7; color: var(--ink-2); overflow-wrap: break-word; }
.prose-content h2 { font-family: var(--font-heading); font-size: 22px; font-weight: 400; color: var(--ink); margin: 40px 0 14px; }
.prose-content h3 { font-family: var(--font-heading); font-size: 18px; font-weight: 400; color: var(--ink); margin: 32px 0 10px; }
.prose-content h4 { font-size: 16px; color: var(--ink); margin: 24px 0 8px; }
.prose-content > :first-child { margin-top: 0; }
.prose-content p { margin: 0 0 16px; line-height: 1.75; }
.prose-content ul, .prose-content ol { padding-left: 24px; margin: 16px 0; }
.prose-content li { margin-bottom: 6px; line-height: 1.75; }
.prose-content strong { color: var(--ink); font-weight: 600; }
.prose-content a { color: var(--ink); }
.prose-content a.missing { text-decoration-style: dashed; text-decoration-color: var(--muted); cursor: help; }
.prose-content .cite a { text-decoration-thickness: 1px; }
.prose-content code { font-family: var(--font-mono); font-size: 0.85em; background: var(--code-bg); color: var(--ink); padding: 2px 6px; border-radius: 4px; }
.prose-content pre { font-family: var(--font-mono); background: var(--pre-bg); color: var(--pre-ink); padding: 16px 20px; border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.6; margin: 24px 0; }
.prose-content pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
/* Textdiagramme (```text, ASCII-Bäume): heller Grund wie eine Abbildung, ohne Ligaturen, Zeilenhöhe so,
   dass die Rahmenzeichen von JetBrains Mono (Höhe 1,52 em) senkrecht durchgehen; breite Bäume scrollen waagerecht. */
.prose-content pre.diagram { background: var(--wash); color: var(--ink); border: 1px solid var(--border); font-size: 13.5px; line-height: 1.45; font-variant-ligatures: none; tab-size: 4; white-space: pre; }
.pv-inner .prose-content pre.diagram { font-size: 12px; padding: 12px 14px; }
@media (max-width: 600px) { .prose-content pre, .prose-content pre.diagram { font-size: 12px; padding: 12px 14px; } }
/* Sprung zu einer offenen Stelle */
.prose-content .flash { animation: flash 2.6s ease-out 1; border-radius: 6px; scroll-margin: 80px; }
@keyframes flash { 0%, 45% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.prose-content blockquote { border-left: 3px solid var(--ink); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 14px 20px; border-radius: 8px; margin: 24px 0; }
.prose-content blockquote p { color: var(--ink); margin-bottom: 0; }
.prose-content blockquote p + p { margin-top: 10px; }
.prose-content blockquote.callout.todo { border-left: 3px solid color-mix(in srgb, var(--ink) 22%, transparent); background: var(--wash); }
.prose-content blockquote.callout.todo::before { content: "Offen"; display: block; font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.prose-content blockquote.callout.contra { border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); }
.prose-content table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 15px; display: block; overflow-x: auto; }
.prose-content thead { border-bottom: 1.5px solid var(--ink); }
.prose-content th { text-align: left; padding: 10px 14px; font-weight: 600; color: var(--ink); font-size: 14px; }
.prose-content td { padding: 10px 14px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.prose-content hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
.prose-content .footnote { font-size: 14px; color: var(--muted); margin-top: 40px; }
.prose-content .footnote-ref { text-decoration: none; font-size: 0.8em; padding: 0 1px; }
.prose-content img { max-width: 100%; border-radius: 14px; }

/* Sprungleiste im Kopf */
.jump { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; }
.jump[hidden] { display: none; }
details.fold { margin-bottom: 12px; }
details.fold[open] > summary { border-bottom: 1px solid var(--grid); }
.sumnote { font-weight: 400; color: var(--muted); }

/* Lernpfad: Einstiegsseiten als nummerierte Schritte */
.lern { margin-bottom: 12px; }
.lern[hidden] { display: none; }
.lern-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.lern-head h2 { margin: 0 0 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; align-content: start; padding: 10px 12px; border: 1px solid var(--grid); border-radius: 10px; cursor: pointer; }
.step:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.step-n { grid-row: span 3; display: inline-block; width: 26px; height: 26px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 13px/26px var(--font-body); text-align: center; }
.step .linkish { font-weight: 600; line-height: 1.35; }
.step-k { display: inline-flex; gap: 5px; align-items: center; font: 11px var(--font-mono); color: var(--muted); }
.step-d { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.r-path { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 12px var(--font-mono); color: var(--muted); margin-bottom: 12px; }
.r-path .step-n { width: 22px; height: 22px; line-height: 22px; font-size: 12px; }
.r-path .ghost { font: 12px var(--font-body); padding: 1px 8px; }
.r-pathnav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
.r-pathnav button { flex: 0 1 calc(50% - 5px); min-width: 220px; text-align: left; border: 1px solid var(--border); background: transparent; border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); }
.r-pathnav button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.r-pathnav .next { margin-left: auto; text-align: right; }
.r-pathnav .lbl { display: block; font: 11px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.r-pathnav .ttl { display: block; font-family: var(--font-heading); font-size: 16px; line-height: 1.3; margin-top: 3px; }
.r-pathnav .end { flex: 0 1 calc(50% - 5px); margin-left: auto; align-self: center; text-align: right; font-size: 13px; color: var(--muted); }
@media (max-width: 600px) { .r-pathnav button, .r-pathnav .end { flex-basis: 100%; min-width: 0; } }

/* Glossar */
.gl-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 4px; }
.letters { display: flex; flex-wrap: wrap; gap: 2px; }

-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 7.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 7\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 130–133.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 130–133\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003ccode>pytest\u003c/code> für die betroffenen Unit- und Integrationstests, Tests mit Netz oder API-Schlüssel markiert\n   (\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 8 und 10.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 8 und 10\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>Die drei Generatoren gelaufen und ihr Ergebnis im Commit\n   (\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 9\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 142–171.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 142–171\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003ccode>test_examples\u003c/code> und \u003ccode>return_schema\u003c/code> in der Konfiguration, \u003ccode>python scripts/test_new_tools.py &lt;muster&gt;\u003c/code> ohne\n   Fehler und ohne „Schema Mismatch“ in der Ausgabe; eine Schema-Abweichung ändert den Exit-Code nicht\n   (\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-too u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Was sollte vor einem Pull Request mit neuem Tool lokal erledigt sein, damit Review und CI ohne Umweg durchgehen?", "outline": ["Frage", "Kerninsichten", "Verwandte Seiten"], "refs": [{"key": "tu-pr-template", "page": "sources/tu-pr-template", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026d, Oktober 24). \u003cem>Pull request template\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\u003c/a>", "access": "fulltext", "order": 3}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}, {"key": "tu-tool-test-scripts", "page": "sources/tu-tool-test-scripts", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026i). \u003cem>Tool test scripts and weekly health check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 8}, {"key": "tu-skills-and-githooks", "page": "sources/tu-skills-and-githooks", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026j). \u003cem>ToolUniverse Skills (README), Git hooks and skill call check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 9}], "apa": null, "open": [], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/antwortformat", "title": "Antwortformat eines Tools", "type": "concept", "description": "Was ein Tool zurückgibt; Feld status mit Daten unter data gilt als neuer Stil, success als alter, und Fehler stehen nicht überall gleich.", "access": "", "in": 6, "out": 6, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["Rückgabeformat", "Response-Format", "status und data"], "cite": "", "ris": "", "heading": "Antwortformat eines Tools", "html": "\u003cp>Der Leitfaden für Tests geht davon aus, dass jede Antwort ein Feld \u003ccode>status\u003c/code> trägt; die Daten stehen neu\nverschachtelt unter \u003ccode>data\u003c/code>, in älteren Tools flach daneben \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 3–27.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 3–27\u003c/a>)\u003c/span>. Fehler stehen laut Leitfaden immer auf\noberster Ebene, mit \u003ccode>status: \"error\"\u003c/code> und einem Text in \u003ccode>error\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 87–94.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 87–94\u003c/a>)\u003c/span> Tests sollen beide Datenformen lesen,\netwa mit \u003ccode>result.get(\"data\", result)\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 29–50.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 29–50\u003c/a>)\u003c/span>\u003c/p>\n\u003cp>Das Testskript behandelt Antworten mit \u003ccode>status\u003c/code> als neuen Stil und Antworten mit \u003ccode>success\u003c/code> als alten; vor der\nPrüfung gegen \u003ccode>return_schema\u003c/code> packt es \u003ccode>data\u003c/code> aus, außer das Schema beschreibt selbst die Hülle \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 395–426.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 395–426\u003c/a>)\u003c/span>. Auch\nder Wheel-Test der CI prüft das Feld \u003ccode>status\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 53–56.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 53–56\u003c/a>)\u003c/span>\u003c/p>\n\u003cpre class=\"diagram\">\u003ccode class=\"language-text\">neu, verschachtelt              alt, flach                  Fehler laut Leitfaden       Fehler in vielen Tools\n{&quot;status&quot;: &quot;success&quot;,           {&quot;status&quot;: &quot;success&quot;,       {&quot;status&quot;: &quot;error&quot;,         {&quot;status&quot;: &quot;error&quot;,\n &quot;data&quot;: {&quot;results&quot;: [...]}}     &quot;results&quot;: [...]}           &quot;error&quot;: &quot;Text&quot;}            &quot;data&quot;: {&quot;error&quot;: &quot;Text&quot;}}\n\u003c/code>\u003c/pre>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Nach dem \u003ca data-page=\"sources/tu-test-writing-guide\" href=\"#sources/tu-test-writing-guide\">Leitfaden für Tests\u003c/a> stehen Fehler immer auf\noberster Ebene \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 87–94.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 87–94\u003c/a>)\u003c/span>; das \u003ca data-page=\"sources/tu-tool-test-scripts\" href=\"#sources/tu-tool-test-scripts\">Testskript\u003c/a> hält fest, dass viele Tools den\nFehler in \u003ccode>data\u003c/code> legen (nach seiner Zählung rund 87 Stellen), und sucht ihn deshalb an beiden Orten \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 184–198.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 184–198\u003c/a>)\u003c/span>.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-2\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Der \u003ca data-page=\"sources/tu-test-writing-guide\" href=\"#sources/tu-test-writing-guide\">Leitfaden für Tests\u003c/a> verlangt \u003ccode>status\u003c/code> in jeder\nAntwort \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 171.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 171\u003c/a>)\u003c/span>; die \u003ca data-page=\"sources/tu-adding-tools-quickref\" href=\"#sources/tu-adding-tools-quickref\">Kurzreferenz\u003c/a> verlangt als einheitliches Format\n\u003ccode>success: True/False\u003c/code>, ihre Beispiele haben kein \u003ccode>status\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 25–26 und 155.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 25–26 und 155\u003c/a>)\u003c/span> Das \u003ca data-page=\"sources/tu-tool-test-scripts\" href=\"#sources/tu-tool-test-scripts\">Testskript\u003c/a>\nführt \u003ccode>success\u003c/code> als alten Stil \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 395–426.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 395–426\u003c/a>)\u003c/span>.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Der Leitfaden für Tests geht davon aus, dass jede Antwort ein Feld status trägt; die Daten stehen neu verschachtelt unter data, in älteren Tools flach daneben (mims-harvard, 2026g, Zeile 3–27). Fehler stehen laut Leitfaden immer auf oberster Ebene, mit status: \"error\" und einem Text in error. (mims-harvard, 2026g …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-adding-tools-quickref", "page": "sources/tu-adding-tools-quickref", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026e, Oktober 24). \u003cem>Quick Reference – Adding Tools; Tool Generation Guide\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\u003c/a>", "access": "fulltext", "order": 4}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}, {"key": "tu-test-writing-guide", "page": "sources/tu-test-writing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026g, Oktober 24). \u003cem>Test Writing Guide for ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/TEST_WRITING_GUIDE.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/TEST_WRITING_GUIDE.md\u003c/a>", "access": "fulltext", "order": 6}, {"key": "tu-tool-test-scripts", "page": "sources/tu-tool-test-scripts", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026i). \u003cem>Tool test scripts and weekly health check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 8}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Nach dem Leitfaden für Tests stehen Fehler immer auf oberster Ebene (mims-harvard, 2026g, Zeile 87–94); das Testskript hält fest, dass viele Tools den Fehler in data legen (nach seiner Zählung rund 87 Stellen), und …"}, {"kind": "contra", "id": "offen-2", "text": "Der Leitfaden für Tests verlangt status in jeder Antwort (mims-harvard, 2026g, Zeile 171); die Kurzreferenz verlangt als einheitliches Format success: True/False, ihre Beispiele haben kein status. (mims-harvard, 2026e …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/ci-testlauf", "title": "CI-Testlauf", "type": "concept", "description": "Der Workflow tests.yml bei Push und Pull Request auf main, mit Wheel-Test, Ruff, Prüfung der generierten Dateien und Tests.", "access": "", "in": 9, "out": 5, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["tests.yml", "GitHub Actions", "Continuous Integration"], "cite": "", "ris": "", "heading": "CI-Testlauf", "html": "\u003cp>Der Workflow \u003ccode>tests.yml\u003c/code> läuft bei jedem Push und Pull Request auf \u003ccode>main\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 3–7.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–7\u003c/a>)\u003c/span> Ein Job baut das Wheel und\nprüft es unter Python 3.10 bis 3.14, auch darauf, ob es alle Datendateien mitbringt \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 10–94.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 10–94\u003c/a>)\u003c/span>. Der Testjob unter\nPython 3.12 arbeitet diese Schritte ab \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 96–216.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 96–216\u003c/a>)\u003c/span>:\u003c/p>\n\u003cpre class=\"diagram\">\u003ccode class=\"language-text\">Ruff-Action 0.15.22            Schritt „Check code formatting/linting requirements“\ngenerierte Dateien aktuell?    build_tools.py, generate_lazy_registry.py, gen_api_key_catalog.py\nSDK erzeugen                   build_tools.py\nDoku-Beispiele prüfen          docs/validate_examples.py\nUnit- und Integrationstests    parallel, ohne slow, network, require_api_keys, require_gpu; 30 Minuten\ndoctor, PyMuPDF-Backend        Zusatzprüfungen\ntools/, examples/, api/        an workflow_dispatch gebunden, das unter on: fehlt; läuft hier nicht\n\u003c/code>\u003c/pre>\n\u003cp>Der letzte Schritt ist an einen manuellen Start gebunden, den der Workflow nicht vorsieht: Ausgelöst wird er nur\ndurch Push und Pull Request \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 3–7.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–7\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 211–216.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 211–216\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp id=\"offen-1\">\u003cstrong>Zu prüfen:\u003c/strong> Der allgemeine \u003ca data-page=\"sources/tu-contributing-guide\" href=\"#sources/tu-contributing-guide\">Beitragsleitfaden\u003c/a> sagt, die CI prüfe auch\nTypen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 364–372.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 364–372\u003c/a>)\u003c/span>; in \u003ccode>tests.yml\u003c/code> läuft kein Typprüfer \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 96–216.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 96–216\u003c/a>)\u003c/span>. Ob ein anderer Workflow das übernimmt, belegen die\nQuellen dieses Wikis nicht.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Der Workflow tests.yml läuft bei jedem Push und Pull Request auf main. (mims-harvard, 2026f, Zeile 3–7) Ein Job baut das Wheel und prüft es unter Python 3.10 bis 3.14, auch darauf, ob es alle Datendateien mitbringt (mims-harvard, 2026f, Zeile 10–94). Der Testjob unter Python 3.12 arbeitet diese Schritte ab …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}], "apa": null, "open": [{"kind": "check", "id": "offen-1", "text": "Zu prüfen: Der allgemeine Beitragsleitfaden sagt, die CI prüfe auch Typen (mims-harvard, 2026a, Zeile 364–372); in tests.yml läuft kein Typprüfer (mims-harvard, 2026f, Zeile 96–216). Ob ein anderer Workflow das …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/entwicklungsumgebung", "title": "Entwicklungsumgebung einrichten", "type": "concept", "description": "Fork, Klon, editierbare Installation mit den Entwicklungs-Extras und pre-commit; dazu Python-Version und die Frage uv oder venv.", "access": "", "in": 7, "out": 10, "domain": [], "subtype": "", "subfield": "", "tags": ["einstieg"], "aliases": ["Development Setup", "Entwicklungsinstallation"], "cite": "", "ris": "", "heading": "Entwicklungsumgebung einrichten", "html": "\u003cp>Beide Beitragsleitfäden beginnen gleich: das Repository auf GitHub forken, den eigenen Fork klonen, eine\nvirtuelle Umgebung mit \u003ccode>python -m venv\u003c/code> anlegen und das Paket mit den Entwicklungs-Extras editierbar\ninstallieren, \u003ccode>pip install -e \".[dev]\"\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 12–31.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 12–31\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 34–48.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 34–48\u003c/a>)\u003c/span> Danach kommen die Hooks von \u003ca data-page=\"entities/pre-commit\" href=\"#entities/pre-commit\">pre-commit\u003c/a>\ndazu, am einfachsten mit \u003ccode>./setup_precommit.sh\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 33–53.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 33–53\u003c/a>)\u003c/span> Zu den Entwicklungsabhängigkeiten gehören\n\u003ca data-page=\"entities/pytest\" href=\"#entities/pytest\">pytest\u003c/a>, \u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a>, Sphinx und pre-commit \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 58–63.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 58–63\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>Vorausgesetzt ist Python 3.10 oder neuer, auf Apple-Silicon-Macs zusätzlich macOS 14. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-readme\" title=\"README.md, Zeile 69.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026k, Zeile 69\u003c/a>)\u003c/span> Die CI\ninstalliert das Projekt mit \u003ccode>uv pip install -e .[dev]\u003c/code> und testet unter Python 3.12 \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 96–128.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 96–128\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp id=\"offen-1\">\u003cstrong>Zu prüfen:\u003c/strong> Das README rät für die Python-Entwicklung zu \u003ccode>uv\u003c/code>, weil auf einem aktuellen Mac System-\u003ccode>pip\u003c/code> an\nPEP 668 und \u003ccode>python3 -m venv\u003c/code> an \u003ccode>ensurepip\u003c/code> scheitern kann \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-readme\" title=\"README.md, Zeile 62–67.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026k, Zeile 62–67\u003c/a>)\u003c/span>; die Beitragsleitfäden nennen dennoch\n\u003ccode>python -m venv\u003c/code> und \u003ccode>pip\u003c/code>. Ob \u003ccode>uv venv\u003c/code> und \u003ccode>uv pip install -e \".[dev]\"\u003c/code> der vorgesehene Weg für Beiträge\nsind, sagt keine der Quellen.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"syntheses/erster-tool-beitrag\" href=\"#syntheses/erster-tool-beitrag\">Der Weg zum ersten Tool-Beitrag\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Beide Beitragsleitfäden beginnen gleich: das Repository auf GitHub forken, den eigenen Fork klonen, eine virtuelle Umgebung mit python -m venv anlegen und das Paket mit den Entwicklungs-Extras editierbar installieren, pip install -e \".[dev]\". (mims-harvard, 2026a, Zeile 12–31; mims-harvard, 2026b, Zeile 34–48) Danach …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "access": "fulltext", "order": 1}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}, {"key": "tu-readme", "page": "sources/tu-readme", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026k, Oktober 24). \u003cem>ToolUniverse: Democratizing AI scientists (README)\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\u003c/a>", "access": "fulltext", "order": 10}], "apa": null, "open": [{"kind": "check", "id": "offen-1", "text": "Zu prüfen: Das README rät für die Python-Entwicklung zu uv, weil auf einem aktuellen Mac System-pip an PEP 668 und python3 -m venv an ensurepip scheitern kann (mims-harvard, 2026k, Zeile 62–67); die Beitragsleitfäden …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/generierte-dateien", "title": "Generierte Dateien", "type": "concept", "description": "Von Skripten erzeugte Dateien wie Tool-Code und statische Registry; die CI erzeugt sie neu und bricht ab, wenn der Commit nicht passt.", "access": "", "in": 9, "out": 7, "domain": [], "subtype": "", "subfield": "", "tags": ["einstieg"], "aliases": ["build_tools.py", "SDK-Wrapper", "statische Registry"], "cite": "", "ris": "", "heading": "Generierte Dateien", "html": "\u003cp>Einige Dateien im Repository erzeugen Skripte, und sie müssen zum Stand im Commit passen. Die CI erzeugt sie in\neinem eigenen Schritt neu und bricht ab, wenn dabei etwas anderes herauskommt als im Commit: betroffen sind\n\u003ccode>src/tooluniverse/tools\u003c/code>, \u003ccode>src/tooluniverse/_lazy_registry_static.py\u003c/code>,\n\u003ccode>src/tooluniverse/data/api_keys_catalog.json\u003c/code> und \u003ccode>.env.template\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 142–171.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 142–171\u003c/a>)\u003c/span> Die Fehlermeldung nennt die drei\nBefehle, deren Ergebnis mit in den Commit gehört \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 163–166.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 163–166\u003c/a>)\u003c/span>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-bash\">python scripts/build_tools.py --force\npython src/tooluniverse/generate_lazy_registry.py\npython scripts/gen_api_key_catalog.py\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>build_tools.py\u003c/code> erzeugt Code aus den Tool-Konfigurationen; es erkennt Änderungen über einen MD5-Hash je\nKonfiguration ohne Zeitstempelfelder und erzeugt ohne \u003ccode>--force\u003c/code> nur neue und geänderte Tools \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"BUILD_TOOLS_GUIDE.md, Zeile 5–23 und 44–54.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 5–23 und 44–54\u003c/a>)\u003c/span>.\n\u003ccode>generate_lazy_registry.py\u003c/code> schreibt die statische Registry aus der AST-Suche im Python-Quelltext \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"generate_lazy_registry.py, Zeile 2–5 und 32–36.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 2–5 und 32–36\u003c/a>)\u003c/span>. Auch die\nPR-Vorlage fragt, ob erzeugte SDK- und Tool-Dateien nach geänderten Tool-Metadaten neu gebaut wurden \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 9\u003c/a>)\u003c/span>.\u003c/p>\n\u003cblockquote class=\"callout todo\" id=\"offen-1\">\n\u003cp>Was \u003ccode>gen_api_key_catalog.py\u003c/code> erzeugt und woraus \u003ccode>api_keys_catalog.json\u003c/code> und \u003ccode>.env.template\u003c/code> entstehen,\nsteht in keiner Quelle dieses Wikis.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"analyses/checkliste-vor-dem-pr\" href=\"#analyses/checkliste-vor-dem-pr\">Prüfliste vor dem Pull Request\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Einige Dateien im Repository erzeugen Skripte, und sie müssen zum Stand im Commit passen. Die CI erzeugt sie in einem eigenen Schritt neu und bricht ab, wenn dabei etwas anderes herauskommt als im Commit: betroffen sind src/tooluniverse/tools, src/tooluniverse/_lazy_registry_static.py …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-pr-template", "page": "sources/tu-pr-template", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026d, Oktober 24). \u003cem>Pull request template\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\u003c/a>", "access": "fulltext", "order": 3}, {"key": "tu-adding-tools-quickref", "page": "sources/tu-adding-tools-quickref", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026e, Oktober 24). \u003cem>Quick Reference – Adding Tools; Tool Generation Guide\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\u003c/a>", "access": "fulltext", "order": 4}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 5}, {"key": "tu-tool-registry-code", "page": "sources/tu-tool-registry-code", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026h). \u003cem>Tool registry and automatic discovery (source code)\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\u003c/a>", "access": "fulltext", "order": 7}], "apa": null, "open": [{"kind": "todo", "id": "offen-1", "text": "Was gen_api_key_catalog.py erzeugt und woraus api_keys_catalog.json und .env.template entstehen, steht in keiner Quelle dieses Wikis."}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/lokales-tool", "title": "Lokales Tool", "type": "concept", "description": "Python-Klasse, die im Prozess von ToolUniverse läuft; für einen Beitrag Klasse in src/tooluniverse/ plus JSON-Konfiguration in data/.", "access": "", "in": 10, "out": 7, "domain": [], "subtype": "", "subfield": "", "tags": ["einstieg"], "aliases": ["Local Tool", "lokale Tools"], "cite": "", "ris": "", "heading": "Lokales Tool", "html": "\u003cp>Ein lokales Tool ist eine Python-Klasse, die im selben Prozess wie ToolUniverse läuft; das spart den Weg über\ndas Netz und eignet sich für API-Wrapper, Datenverarbeitung und leichte Berechnungen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"index.rst, Zeile 41–54.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 41–54\u003c/a>)\u003c/span>. Für ein Tool, das\nins Repository soll, gehören zwei Teile zusammen: die Klasse in \u003ccode>src/tooluniverse/\u003c/code>, dekoriert mit\n\u003ccode>@register_tool('Typname')\u003c/code>, und ihre \u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Konfiguration\u003c/a> als JSON-Datei in\n\u003ccode>src/tooluniverse/data/\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 50–61 und 102–105.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 50–61 und 102–105\u003c/a>)\u003c/span> Gefunden wird die Klasse über die\n\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">automatische Erkennung\u003c/a> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 136–141.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 136–141\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>Wer ein Tool nur selbst nutzen will, kommt mit einer einzigen Datei aus und ändert keine Kerndateien \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 9–10.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 9–10\u003c/a>)\u003c/span>.\nLiegt die Datei außerhalb des Pakets, muss sie vor \u003ccode>load_tools()\u003c/code> importiert werden, damit der Dekorator läuft;\n\u003ccode>tool_config_files\u003c/code> allein lädt nur die JSON-Spezifikation \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 87–100.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 87–100\u003c/a>)\u003c/span>.\u003c/p>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Der Leitfaden für lokale Tools nennt Änderungen an \u003ccode>__init__.py\u003c/code> an vier Stellen den\nwichtigsten Schritt und sagt in Schritt 5, dass keine nötig sind (\u003ca data-page=\"sources/tu-expand-contributing\" href=\"#sources/tu-expand-contributing\">Expand ToolUniverse\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 7 und 136–141; index.rst, Zeile 56; contributing-index.rst, Zeile 23.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 7 und 136–141\u003c/a>)\u003c/span>.\nDer \u003ca data-page=\"sources/tu-tool-registry-code\" href=\"#sources/tu-tool-registry-code\">Quellcode der Registrierung\u003c/a> stützt Schritt 5: Der Paket-Einstieg holt\nTool-Klassen dynamisch aus der Registry und ergänzt \u003ccode>__all__\u003c/code> selbst um die gefundenen Tools \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"__init__.py, Zeile 122–166 und 209–217.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 122–166 und 209–217\u003c/a>)\u003c/span>.\u003c/p>\n\u003c/blockquote>\n\u003cp>Unit-Tests gehören nach \u003ccode>tests/unit/\u003c/code> \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 151–154.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 151–154\u003c/a>)\u003c/span>; die Übersicht der zehn Schritte nennt sie optional, derselbe\nLeitfaden verlangt mehr als 90 % Abdeckung \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 21 und 370–372.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 21 und 370–372\u003c/a>)\u003c/span>. Der häufigste Fehler laut Leitfaden ist ein fehlender\nDekorator \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 357–359.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 357–359\u003c/a>)\u003c/span>.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/remote-tool\" href=\"#concepts/remote-tool\">Remote-Tool\u003c/a>, die Alternative auf eigenem Server\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"syntheses/erster-tool-beitrag\" href=\"#syntheses/erster-tool-beitrag\">Der Weg zum ersten Tool-Beitrag\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Ein lokales Tool ist eine Python-Klasse, die im selben Prozess wie ToolUniverse läuft; das spart den Weg über das Netz und eignet sich für API-Wrapper, Datenverarbeitung und leichte Berechnungen (mims-harvard, 2026b, Zeile 41–54). Für ein Tool, das ins Repository soll, gehören zwei Teile zusammen: die Klasse in …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "access": "fulltext", "order": 1}, {"key": "tu-tool-registry-code", "page": "sources/tu-tool-registry-code", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026h). \u003cem>Tool registry and automatic discovery (source code)\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\u003c/a>", "access": "fulltext", "order": 7}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Der Leitfaden für lokale Tools nennt Änderungen an __init__.py an vier Stellen den wichtigsten Schritt und sagt in Schritt 5, dass keine nötig sind (Expand ToolUniverse) (mims-harvard, 2026b, Zeile 7 und 136–141). Der …"}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/pruefungen-vor-commit-und-push", "title": "Prüfungen vor Commit und Push", "type": "concept", "description": "Was pre-commit vor jedem Commit prüft, was der Pre-Push-Hook abweist und wofür die Hooks nicht gelten.", "access": "", "in": 9, "out": 7, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": ["Git-Hooks", "pre-commit-Hooks", "Pre-Push-Hook"], "cite": "", "ris": "", "heading": "Prüfungen vor Commit und Push", "html": "\u003cp>Vor jedem Commit führt \u003ca data-page=\"entities/pre-commit\" href=\"#entities/pre-commit\">pre-commit\u003c/a> die Hooks aus \u003ccode>.pre-commit-config.yaml\u003c/code> aus:\nPrüfungen auf Dateiende, Leerzeichen am Zeilenende, YAML- und TOML-Syntax, dann \u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a> mit\nautomatischer Korrektur und Formatierung \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 10–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 10–26\u003c/a>)\u003c/span>. Die Hooks gelten nur für Dateien unter \u003ccode>src/tooluniverse/\u003c/code>;\nDateien in \u003ccode>tests/\u003c/code> oder \u003ccode>docs/\u003c/code> erfassen sie damit nicht \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 1.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 1\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>In \u003ccode>.githooks/\u003c/code> liegen zwei weitere Hooks. Der Pre-Push-Hook bricht ab, wenn ein Push Notizdateien wie\n\u003ccode>*_SUMMARY.md\u003c/code> oder \u003ccode>*_REPORT.md\u003c/code> im Wurzelordner, Testskripte \u003ccode>test_*.py\u003c/code> im Wurzelordner, eine \u003ccode>.env\u003c/code> oder\nDateien aus \u003ccode>temp_docs_and_tests/\u003c/code> enthält \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"pre-push, Zeile 9–52.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 9–52\u003c/a>)\u003c/span>; \u003ccode>pre-commit-docs\u003c/code> prüft geänderte \u003ccode>.rst\u003c/code>- und\n\u003ccode>.md\u003c/code>-Dateien, meldet aber nur Warnungen und lässt den Commit zu. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"pre-commit-docs, Zeile 2–25 und 139–152.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 2–25 und 139–152\u003c/a>)\u003c/span>\u003c/p>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die Leitfäden in \u003ca data-page=\"sources/tu-expand-contributing\" href=\"#sources/tu-expand-contributing\">Expand ToolUniverse\u003c/a> kündigen beim\nCommit Black, Flake8 und Ruff an \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 191–197; remote_tools.rst, Zeile 300–306.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 191–197\u003c/a>)\u003c/span>; die \u003ca data-page=\"sources/tu-pre-commit\" href=\"#sources/tu-pre-commit\">pre-commit-Konfiguration\u003c/a> enthält von\nden dreien nur Ruff \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 10–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 10–26\u003c/a>)\u003c/span>.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout todo\" id=\"offen-2\">\n\u003cp>Wie die Hooks in \u003ccode>.githooks/\u003c/code> aktiviert werden, steht in keiner Quelle dieses Wikis.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"analyses/checkliste-vor-dem-pr\" href=\"#analyses/checkliste-vor-dem-pr\">Prüfliste vor dem Pull Request\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Vor jedem Commit führt pre-commit die Hooks aus .pre-commit-config.yaml aus: Prüfungen auf Dateiende, Leerzeichen am Zeilenende, YAML- und TOML-Syntax, dann Ruff mit automatischer Korrektur und Formatierung (mims-harvard, 2026c, Zeile 10–26). Die Hooks gelten nur für Dateien unter src/tooluniverse/; Dateien in tests/ …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026b, Oktober 24). \u003cem>Expand ToolUniverse: Contributing local and remote tools\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/expand_tooluniverse\u003c/a>", "access": "fulltext", "order": 1}, {"key": "tu-pre-commit", "page": "sources/tu-pre-commit", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026c). \u003cem>Pre-commit configuration and setup script\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 2}, {"key": "tu-skills-and-githooks", "page": "sources/tu-skills-and-githooks", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026j). \u003cem>ToolUniverse Skills (README), Git hooks and skill call check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "access": "fulltext", "order": 9}], "apa": null, "open": [{"kind": "contra", "id": "offen-1", "text": "Die Leitfäden in Expand ToolUniverse kündigen beim Commit Black, Flake8 und Ruff an (mims-harvard, 2026b, Zeile 191–197); die pre-commit-Konfiguration enthält von den dreien nur Ruff (mims-harvard, 2026c, Zeile 10–26)."}, {"kind": "todo", "id": "offen-2", "text": "Wie die Hooks in .githooks/ aktiviert werden, steht in keiner Quelle dieses Wikis."}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "concepts/register-tool-und-erkennung", "title": "Registrierung und automatische Erkennung", "type": "concept", "description": "Wie register_tool, die AST-Suche und die Lazy Registry ein neues Tool finden, ohne dass jemand Listen pflegt.", "access": "", "in": 8, "out": 6, "domain": [], "subtype": "", "subfield": "", "tags": ["einstieg"], "aliases": ["register_tool", "AST-Erkennung", "Lazy Registry", "Tool-Registry"], "cite": "", "ris": "", "heading": "Registrierung und automatische Erkennung", "html": "\u003cp>Der Dekorator \u003ccode>register_tool\u003c/code> trägt eine Klasse unter dem angegebenen Typnamen, sonst unter ihrem Klassennamen,\nin die Tool-Registry ein; eine mitgegebene Konfiguration landet zusätzlich in der Konfigurations-Registry \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 58–89.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 58–89\u003c/a>)\u003c/span>.\nDamit niemand Tools von Hand eintragen muss, durchsucht ToolUniverse den Quelltext des Pakets, ohne ihn zu\nimportieren: Die AST-Suche liest jede Python-Datei außerhalb von Ordnern wie \u003ccode>data\u003c/code>, \u003ccode>tools\u003c/code>, \u003ccode>remote\u003c/code>,\n\u003ccode>scripts\u003c/code> und \u003ccode>tests\u003c/code> und merkt sich jede öffentliche Klasse auf oberster Ebene mit \u003ccode>@register_tool(...)\u003c/code> samt\nModul \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 242–351.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 242–351\u003c/a>)\u003c/span>. Importiert wird ein Modul erst beim ersten Zugriff auf sein Tool; Lazy Loading ist\nStandard \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"__init__.py, Zeile 58–61.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 58–61\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"__init__.py, Zeile 122–166.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 122–166\u003c/a>)\u003c/span>. Ist es abgeschaltet oder kennt die Lazy Registry ein Tool nicht, importiert die\nvollständige Erkennung alle Module auf oberster Ebene, deren Name \u003ccode>_tool\u003c/code> enthält \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 688–701 und 729–736; __init__.py, Zeile 179–182.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 688–701 und 729–736\u003c/a>)\u003c/span>.\u003c/p>\n\u003cp>Für gebündelte Umgebungen ohne Quelldateien gibt es eine statische Fassung der Registry,\n\u003ccode>_lazy_registry_static.py\u003c/code>, erzeugt von \u003ccode>generate_lazy_registry.py\u003c/code>. \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"generate_lazy_registry.py, Zeile 2–5.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 2–5\u003c/a>)\u003c/span> Liegt sie vor, ergänzt die AST-Suche\nsie um neue Tool-Dateien, sodass ein neues Tool auch ohne Neubau gefunden wird \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 354–392.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 354–392\u003c/a>)\u003c/span>. Die CI verlangt\ntrotzdem, dass die statische Fassung im Commit aktuell ist (\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 142–171.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 142–171\u003c/a>)\u003c/span>.\u003c/p>\n\u003cpre class=\"diagram\">\u003ccode class=\"language-text\">src/tooluniverse/mein_tool.py      @register_tool(&quot;MeinTool&quot;)\n        │\n        ▼  AST-Suche, ohne Import\nLazy Registry  {&quot;MeinTool&quot;: &quot;mein_tool&quot;}  ◄── ergänzt _lazy_registry_static.py, falls vorhanden\n        │\n        ▼  erster Zugriff, z. B. from tooluniverse import MeinTool\nModul mein_tool wird importiert, Klasse kommt aus der Registry\n\u003c/code>\u003c/pre>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die \u003ca data-page=\"sources/tu-adding-tools-quickref\" href=\"#sources/tu-adding-tools-quickref\">Kurzreferenz\u003c/a> verlangt eine Datei auf\n\u003ccode>_tool.py\u003c/code> und nennt die Endung als Ursache, wenn ein Tool nicht gefunden wird \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 150 und 170.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 150 und 170\u003c/a>)\u003c/span>; nach dem\n\u003ca data-page=\"sources/tu-tool-registry-code\" href=\"#sources/tu-tool-registry-code\">Quellcode\u003c/a> findet die Lazy-Suche dekorierte Klassen auch in anderen\nDateien, die Endung \u003ccode>_tool.py\u003c/code> oder \u003ccode>_tools.py\u003c/code> ist dort eine ältere Konvention für Klassen ohne\nDekorator \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 297–302 und 343–344.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 297–302 und 343–344\u003c/a>)\u003c/span>. Nur die vollständige Erkennung braucht \u003ccode>_tool\u003c/code> im Modulnamen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 688–701 und 729–736; __init__.py, Zeile 179–182.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 688–701 und 729–736\u003c/a>)\u003c/span>.\u003c/p>\n\u003c/blockquote>\n\u003cp>Wer beide Wege abdecken will, nennt die Datei \u003ccode>&lt;name&gt;_tool.py\u003c/code> und dekoriert die Klasse \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 297–302 und 343–344.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 297–302 und 343–344\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 688–701 und 729–736; __init__.py, Zeile 179–182.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 688–701 und 729–736\u003c/a>)\u003c/span>.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Der Dekorator register_tool trägt eine Klasse unter dem angegebenen Typnamen, sonst unter ihrem Klassennamen, in die Tool-Registry ein; eine mitgegebene Konfiguration landet zusätzlich in der Konfigurations-Registry (mims-harvard, 2026h, Zeile 58–89). Damit niemand Tools von Hand eintragen muss, durchsucht …", "outline": ["Verwandte Seiten"], "refs": [{"key": "tu-adding-tools-quickref", "page": "sources/tu-adding-tools-quickref", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026e, Oktober 24). \u003cem>Quick Reference – Adding Tools; Tool Generation Guide\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/Adding_Tools_Quick_Reference.md\u003c/a>", "access": "fulltext", "order": 4}, {"key": "tu-tests-and-ci", "page": "sources/tu-tests-and-ci", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and
