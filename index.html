  const COLORDER = ["source", "entity", "concept", "synthesis", "analysis"];
  const folderType = Object.fromEntries(D.types.map(t => [t.folder, t.name]));
  const homeOf = t => { const n = nodes.find(m => m.type === t); return n && folderType[n.id.split("/")[0]]; };
  const typeOrder = [];
  for (const t of [...COLORDER, ...profileOrder.filter(x => !COLORDER.includes(x) && typeLabels[x])]) {
    if (profileOrder.includes(t) && !typeOrder.includes(t)) typeOrder.push(t);
    for (const x of profileOrder) if (!typeLabels[x] && homeOf(x) === t && !typeOrder.includes(x)) typeOrder.push(x);
  }
  for (const x of profileOrder) if (!typeOrder.includes(x)) typeOrder.push(x);
  const count = f => nodes.filter(f).length;
  const tally = list => { const m = new Map(); for (const v of list) m.set(v, (m.get(v) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]))); };
  // Lernpfad: Einstiegsseiten ([index] entry_tag) in der Reihenfolge von order, wie „Zuerst lesen“ im Root-Index
  const PATH = (D.path || []).map(id => byId.get(id)).filter(Boolean);
  const coll = new Intl.Collator("de", { sensitivity: "base", numeric: true });

  // ---------------------------------------------------------------- Farben (Art oder Umfang)
  // Vier validierte Farben; die Unterscheidung trägt zusätzlich die Form (Entitäten als Ring) bzw. die Legende.
  // Themenbereiche und Schlagwörter zeigt das Dashboard nirgends (bewusst, in allen Wikis).
  const TYPE_SLOT = { source: 1, concept: 2, entity: 3, synthesis: 4 };
  // Umfang nur anbieten, wenn Seiten ihn tragen; eine Voreinstellung ohne Treffer gilt als „alle“
  const SC = D.scope && D.scope.values.length && nodes.some(n => n.scope) ? D.scope : null;
  if (SC && SC.default && !nodes.some(n => n.scope === SC.default)) SC.default = "";
  const scopeLab = v => ((SC && SC.values.find(x => x[0] === v)) || [v, v])[1];
  const SCOPE_SLOT = SC ? Object.fromEntries(SC.values.slice(0, 4).map(([v], i) => [v, i + 1])) : {};
  // Sichtbarkeit ([visibility] in wiki.toml): nur die lokale Ausgabe kennt sie; interne Seiten tragen ein Abzeichen
  const VIS = D.visibility && nodes.some(n => n.internal) ? D.visibility : null;
  const visText = n => ((VIS && VIS.values.find(x => x[0] === n.visibility)) || [n.visibility, n.visibility])[1]
    + (n.visibility_derived ? " (abgeleitet)" : "");
  const visBadge = n => (VIS && n.internal ? h("span", { class: "tag internal", title: "Fehlt in der öffentlichen Ausgabe" }, visText(n)) : null);
  let colorBy = "type";
  function paint(n) {
    if (colorBy === "scope") {
      const slot = SCOPE_SLOT[n.scope];
      return slot ? { color: `var(--c${slot})`, ring: n.scope_derived } : { color: "var(--c-other)", ring: true };
    }
    const slot = TYPE_SLOT[n.type];
    return slot ? { color: `var(--c${slot})`, ring: n.type === "entity" } : { color: "var(--c-other)", ring: true };
  }
  function styleDot(el, p) {
    el.classList.toggle("ring", p.ring);
    el.style.fill = p.ring ? `color-mix(in srgb, ${p.color} 16%, var(--surface))` : p.color;
    el.style.stroke = p.ring ? p.color : "";
  }
  function dotSvg(p, size = 12) {
    const sv = s("svg", { width: size, height: size, viewBox: "-6 -6 12 12", "aria-hidden": "true" });
    const c = s("circle", { r: p.ring ? 4 : 5 });
    c.style.fill = p.ring ? "none" : p.color;
    if (p.ring) { c.style.stroke = p.color; c.style.strokeWidth = "2"; }
    sv.append(c);
    return sv;
  }
  const typeDot = t => dotSvg(TYPE_SLOT[t] ? { color: `var(--c${TYPE_SLOT[t]})`, ring: t === "entity" } : { color: "var(--c-other)", ring: true });

  // ---------------------------------------------------------------- Kopf und Überblick
  // Daten kommen als JJJJ-MM-TT; als Kalendertag lesen, sonst zeigt ein Browser westlich von UTC den Vortag
  const day = iso => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
  };
  $("title").replaceChildren(h("span", { class: "hl" }, D.title));
  const internalCount = VIS ? count(n => n.internal) : 0;
  $("subtitle").textContent = `${nodes.length} Seiten` + (internalCount ? `, davon ${internalCount} nicht öffentlich` : "") + ` · Stand ${day(D.generated)}`;
  const srcNodes = nodes.filter(n => n.access);
  const tiles = [
    ["Seiten", nodes.length, typeOrder.map(t => `${tlabel(t)} ${count(n => n.type === t)}`).join(" · ")],
  ];
  // keine Kacheln für Verbindungen, Quellenlage, Themenbereiche oder Schlagwörter (bewusst, in allen Wikis)
  const FW = D.fundweg_arten || {};
  const fwNodes = nodes.filter(n => n.fundweg && n.fundweg.length);
  if (fwNodes.length) {
    const model = fwNodes.filter(n => n.fundweg[0].art === "modellvorschlag").length;
    tiles.push(["Fundweg dokumentiert", fwNodes.length, [`von ${srcNodes.length} Quellen`, `${Math.round(100 * model / fwNodes.length)} % Modellvorschlag`,
      ...tally(fwNodes.map(n => n.fundweg[0].art)).filter(([a]) => a !== "modellvorschlag").slice(0, 2).map(([a, c]) => `${c} ${FW[a] || a}`)].join(" · ")]);
  }
  const licNodes = nodes.filter(n => n.license);
  if (licNodes.length) {
    const clear = licNodes.filter(n => n.license.cls !== "unbekannt").length;
    tiles.push(["Lizenz geklärt", clear, [`von ${licNodes.length} Quellen`, ...tally(licNodes.map(n => n.license.cls)).slice(0, 3).map(([c, k]) => `${k} ${LIC[c] || c}`)].join(" · ")]);
  }
  for (const [l, v, sub] of tiles) $("tiles").append(h("div", { class: "card tile" }, h("div", { class: "l" }, l), h("div", { class: "v" }, String(v)), h("div", { class: "s" }, sub)));

  // ---------------------------------------------------------------- Layout (Kräftesimulation, deterministisch)
  function hash(str) {
    let x = 2166136261;
    for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); }
    return (x >>> 0) / 4294967296;
  }
  // bewusst klein (rund die Hälfte der früheren Größe), damit das Netz lesbar bleibt
  const radius = n => Math.min(2 + 0.85 * Math.sqrt(n.in), 7.5);
  let singleTop = null;
  for (const n of nodes) n.r = radius(n);
  (function layout() {
    // Fruchterman-Reingold mit begrenzter Reichweite, schwachem Zug zum Typ-Anker und zur Mitte,
    // danach Überlappungen auflösen. Startpositionen aus einem Hash der ID: gleiche Daten, gleiches Bild.
    const N = nodes.length;
    if (!N) return;
    const K = 40, CUT2 = (5 * K) * (5 * K);
    const G = profileOrder.length;
    const R = G === 1 ? 0 : K * (2 + Math.sqrt(N) * 0.45);
    const anchor = {};
    profileOrder.forEach((t, j) => {
      const a = -Math.PI / 2 + (2 * Math.PI * j) / G;
      anchor[t] = [R * Math.cos(a), R * Math.sin(a)];
    });
    for (const n of nodes) {
      const [ax, ay] = anchor[n.type];
      const a = 2 * Math.PI * hash(n.id), r = K * 2 * Math.sqrt(hash(n.id + "#"));
      n.x = ax + r * Math.cos(a); n.y = ay + r * Math.sin(a);
    }
    const pairs = new Map();
    for (const e of edges) {
      const key = e.s.id < e.t.id ? e.s.id + "\u0000" + e.t.id : e.t.id + "\u0000" + e.s.id;
      if (!pairs.has(key)) pairs.set(key, [e.s, e.t]);
    }
    const links = [...pairs.values()];
    let temp = K * 3;
    for (let it = 0; it < 360; it++) {
      for (const n of nodes) { n.dx = 0; n.dy = 0; }
      for (let i = 0; i < N; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < N; j++) {
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 > CUT2) continue;
          if (d2 < 0.01) { dx = hash(a.id + b.id) - 0.5; dy = 0.5 - hash(b.id + a.id); d2 = 0.01; }
          const f = (K * K) / d2;
          a.dx += dx * f; a.dy += dy * f; b.dx -= dx * f; b.dy -= dy * f;
        }
      }
      for (const [a, b] of links) {
        const dx = a.x - b.x, dy = a.y - b.y, d = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const f = d / K;
        a.dx -= dx * f; a.dy -= dy * f; b.dx += dx * f; b.dy += dy * f;
      }
      for (const n of nodes) {
        const [ax, ay] = anchor[n.type];
        n.dx += (ax - n.x) * 0.04 - n.x * 0.015;
        n.dy += (ay - n.y) * 0.04 - n.y * 0.015;
        const len = Math.hypot(n.dx, n.dy);
        if (len > 0) { const m = Math.min(len, temp); n.x += (n.dx / len) * m; n.y += (n.dy / len) * m; }
      }
      temp = Math.max(0.6, temp * 0.985);
    }
    for (let round = 0; round < 80; round++) {
      let moved = false;
      for (let i = 0; i < N; i++) {
        const a = nodes[i];
        for (let j = i + 1; j < N; j++) {
          const b = nodes[j];
          const min = a.r + b.r + 6;
          let dx = a.x - b.x, dy = a.y - b.y;
          if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
          let d = Math.sqrt(dx * dx + dy * dy);
          if (d >= min) continue;
          if (d < 0.01) { dx = hash(a.id) - 0.5; dy = hash(b.id) - 0.5; d = Math.hypot(dx, dy) || 1; }
          const push = (min - d) / 2 / d;
          a.x += dx * push; a.y += dy * push; b.x -= dx * push; b.y -= dy * push;
          moved = true;
        }
      }
      if (!moved) break;
    }
    packComponents();
  })();

  // Zusammenhangskomponenten ordnen: größtes Netz, rechts daneben die Inseln, darunter ein Raster
  // der Seiten ohne jede Verbindung (nach Art und Titel sortiert).
  function packComponents() {
    const seen = new Set(), comps = [];
    for (const n of nodes) {
      if (seen.has(n)) continue;
      const c = [], stack = [n];
      seen.add(n);
      while (stack.length) {
        const m = stack.pop();
        c.push(m);
        for (const o of m.nb) if (!seen.has(o)) { seen.add(o); stack.push(o); }
      }
      comps.push(c);
    }
    const box = c => {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const n of c) { x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r); x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r); }
      return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
    };
    const shift = (c, dx, dy) => { for (const n of c) { n.x += dx; n.y += dy; } };
    const multi = comps.filter(c => c.length > 1).sort((a, b) => b.length - a.length);
    const single = comps.filter(c => c.length === 1).map(c => c[0]);
    const GAP = 60;
    let main = multi.length ? box(multi[0]) : { x0: 0, y0: 0, x1: 0, y1: 0, w: 0, h: 0 };
    if (multi.length) shift(multi[0], -main.x0, -main.y0);
    main = multi.length ? box(multi[0]) : main;
    let colX = main.x1 + GAP, colY = 0, colW = 0, bottom = main.y1;
    const colH = Math.max(main.h, 300);
    for (const c of multi.slice(1)) {
      const b = box(c);
      if (colY > 0 && colY + b.h > colH) { colX += colW + GAP; colY = 0; colW = 0; }
      shift(c, colX - b.x0, colY - b.y0);
      colY += b.h + GAP / 2; colW = Math.max(colW, b.w); bottom = Math.max(bottom, colY);
    }
    if (single.length) {
      const order = Object.fromEntries(profileOrder.map((t, i) => [t, i]));
      single.sort((a, b) => order[a.type] - order[b.type] || a.title.localeCompare(b.title));
      const cell = 2 * Math.max(...single.map(n => n.r)) + 14;
      const width = Math.max(main.w, colX + colW, cell * Math.ceil(Math.sqrt(single.length) * 1.6));
      const perRow = Math.max(1, Math.floor(width / cell));
      const top = bottom + GAP;
      single.forEach((n, i) => { n.x = (i % perRow) * cell + cell / 2; n.y = top + Math.floor(i / perRow) * cell + cell / 2; });
      singleTop = top;
    }
  }

  // ---------------------------------------------------------------- Netz zeichnen
  const svg = $("graph");
  const vp = s("g");
  const gE = s("g"), gN = s("g"), gL = s("g");
  vp.append(gE, gN, gL);
  svg.append(vp);
  const isolated = nodes.filter(n => n.nb.size === 0);
  if (isolated.length && singleTop !== null) {
    const cap = s("text", { class: "label", x: 0, y: singleTop - 14 });
    cap.textContent = `Ohne Verbindung: ${isolated.length} Seiten`;
    gL.append(cap);
  }
  for (const e of edges) {
    e.el = s("line", { class: "edge" + (e.kind === "source" ? " src" : ""), x1: e.s.x, y1: e.s.y, x2: e.t.x, y2: e.t.y });
    gE.append(e.el);
  }
  const byIn = (a, b) => b.in - a.in || a.title.localeCompare(b.title);
  const hubs = [...nodes].filter(n => n.in > 0).sort(byIn).slice(0, 15);
  let labelCandidates = hubs;
  function placeLabels() {
    const ctm = svg.getScreenCTM();
    const k = ctm && ctm.a ? ctm.a : 1, fs = 11 / k, placed = [];
    for (const n of nodes) n.label.style.display = "none";
    for (const n of labelCandidates) {
      if (!visible(n)) continue;
      const w = n.label.textContent.length * fs * 0.58, hh = fs * 1.3;
      const x = n.x + n.r + 3 / k, y = n.y - hh * 0.65;
      if (placed.some(q => x < q[2] && x + w > q[0] && y < q[3] && y + hh > q[1])) continue;
      placed.push([x, y, x + w, y + hh]);
      n.label.setAttribute("x", x);
      n.label.setAttribute("y", n.y + fs * 0.35);
      n.label.style.display = "";
    }
  }
  for (const n of nodes) {
    n.g = s("g", { class: "node", transform: `translate(${n.x},${n.y})`, tabindex: "0", role: "button", "aria-label": `${n.title} (${tlabel(n.type)})` });
    n.dot = s("circle", { class: "dot", r: n.r });
    n.g.append(s("circle", { class: "grab", r: n.r + 5 }), s("circle", { class: "halo", r: n.r + 2.5 }), n.dot);
    n.g.addEventListener("pointerenter", ev => { if (pinned) return; hoverN = n; showTip(n, ev); update(); });
    n.g.addEventListener("pointermove", ev => { if (!pinned) moveTip(ev); });
    n.g.addEventListener("pointerleave", () => { if (pinned) return; hoverN = null; hideTip(); update(); });
    n.g.addEventListener("click", ev => { ev.stopPropagation(); hoverN = null; select(n); pin(n, ev); });
    n.g.addEventListener("dblclick", ev => { ev.stopPropagation(); openReader(n, "new"); });
    n.g.addEventListener("keydown", ev => {
      if (ev.key === "Enter") { ev.preventDefault(); openReader(n, "new"); }
      else if (ev.key === " ") { ev.preventDefault(); const r = n.g.getBoundingClientRect(); select(n); pin(n, { clientX: r.right, clientY: r.top }); }
    });
    gN.append(n.g);
    n.label = s("text", { class: "label", x: n.x + n.r + 3, y: n.y + 4 });
    n.label.textContent = n.title.length > 34 ? n.title.slice(0, 33) + "…" : n.title;
    gL.append(n.label);
  }
  function repaint() { for (const n of nodes) styleDot(n.dot, paint(n)); }

  // Zoom und Verschieben über die viewBox
  let vb = { x: -100, y: -100, w: 200, h: 200 };
  function setVB() {
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    const ctm = svg.getScreenCTM();
    const k = ctm && ctm.a ? ctm.a : 1;
    gL.setAttribute("font-size", (11 / k).toFixed(2));
    gL.setAttribute("stroke-width", (3 / k).toFixed(2));
    placeLabels();
  }
  function fit() {
    const pts = nodes.filter(visible);
    if (!pts.length) return;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of pts) { x0 = Math.min(x0, n.x - n.r); y0 = Math.min(y0, n.y - n.r); x1 = Math.max(x1, n.x + n.r); y1 = Math.max(y1, n.y + n.r); }
    const m = Math.max(30, 0.06 * Math.max(x1 - x0, y1 - y0));
    vb = { x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m };
    setVB();
  }
  function toUser(ev) {
    const p = svg.createSVGPoint();
    p.x = ev.clientX; p.y = ev.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  function zoomAt(px, py, f) {
    vb.x = px - (px - vb.x) * f; vb.y = py - (py - vb.y) * f; vb.w *= f; vb.h *= f;
    setVB();
  }
  svg.addEventListener("wheel", ev => { ev.preventDefault(); const p = toUser(ev); zoomAt(p.x, p.y, Math.exp(ev.deltaY * 0.0015)); }, { passive: false });
  let pan = null;
  svg.addEventListener("pointerdown", ev => {
    if (ev.target.closest(".node")) return;
    pan = { x: ev.clientX, y: ev.clientY, vx: vb.x, vy: vb.y, k: svg.getScreenCTM().a, moved: false };
    svg.setPointerCapture(ev.pointerId);
    svg.classList.add("panning");
  });
  svg.addEventListener("pointermove", ev => {
    if (!pan) return;
    const dx = ev.clientX - pan.x, dy = ev.clientY - pan.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) pan.moved = true;
    vb.x = pan.vx - dx / pan.k; vb.y = pan.vy - dy / pan.k;
    setVB();
  });
  svg.addEventListener("pointerup", () => {
    if (pan && !pan.moved) { selected = null; renderPanel(); update(); }
    pan = null;
    svg.classList.remove("panning");
  });
  const centre = () => [vb.x + vb.w / 2, vb.y + vb.h / 2];
  $("zin").addEventListener("click", () => zoomAt(...centre(), 0.75));
  $("zout").addEventListener("click", () => zoomAt(...centre(), 1 / 0.75));
  $("zfit").addEventListener("click", () => fit());
  new ResizeObserver(() => setVB()).observe(svg);

  // ---------------------------------------------------------------- Vorschaukarte
  const tip = $("tip");
  let pinned = null;
  function kindLine(n) {
    const bits = [h("span", { class: "pill" }, dotSvg(paint(n), 11), tlabel(n.type))];
    if (n.subtype) bits.push(h("span", {}, lab(n.subfield, n.subtype)));
    const vb = visBadge(n);
    if (vb) bits.push(vb);
    return h("div", { class: "pv-kind" }, ...bits);
  }
  function preview(n) {
    const kids = [kindLine(n), h("div", { class: "pv-title" }, n.title)];
    if (n.cite) kids.push(h("div", { class: "pv-cite" }, [n.cite, ACCESS[n.access] || n.access, licShort(n)].filter(Boolean).join(" · ")));
    if (n.description) kids.push(h("p", { class: "pv-desc" }, n.description));
    if (n.excerpt) kids.push(h("p", { class: "pv-ex" }, n.excerpt));
    if (n.outline.length) kids.push(h("div", { class: "pv-out" }, "Abschnitte: " + n.outline.join(" · ")));
    kids.push(h("div", { class: "pv-foot" }, h("span", {}, `${n.nb.size} Verbindungen`), h("span", {}, "Klick: ganze Seite in der Karte")));
    return kids;
  }
  function showTip(n, ev) {
    tip.classList.remove("pinned");
    tip.replaceChildren(...preview(n));
    tip.style.display = "block";
    moveTip(ev);
  }
  function moveTip(ev) {
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    let x = ev.clientX + 16, y = ev.clientY + 16;
    if (x + w > innerWidth - 8) x = Math.max(8, ev.clientX - w - 16);
    if (y + hh > innerHeight - 8) y = Math.max(8, innerHeight - hh - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { if (!pinned) tip.style.display = "none"; }
  // Angeheftete Karte: die ganze Seite zum Scrollen, Links öffnen die Zielseite in derselben Karte.
  let pinAt = { clientX: 0, clientY: 0 };
  function pin(n, ev) {
    pinned = n;
    pinScroll = colsScroll.scrollTop;
    if (ev) pinAt = { clientX: ev.clientX, clientY: ev.clientY };
    const inner = h("div", { class: "pv-inner" });
    const go = m => { selected = m; renderPanel(); pin(m); update(); };
    const goFacet = (k, v) => pin({ facet: [k, v] });
    if (n.facet) fillFacet(inner, n.facet[0], n.facet[1], true, go);
    else fillArticle(inner, n, true, go, goFacet);
    const kind = n.facet ? h("span", {}, facetLabel(...n.facet)[0]) : h("span", { class: "pill" }, dotSvg(paint(n), 11), tlabel(n.type));
    tip.replaceChildren(
      h("div", { class: "pv-bar" }, kind, h("span", { class: "sp" }),
        h("button", { class: "btn-primary", type: "button", onclick: () => openReader(n, "new") }, "Ganze Seite"),
        h("button", { class: "ghost", type: "button", "aria-label": "Karte schließen", onclick: () => { unpin(); hoverN = null; update(); } }, "×")),
      inner);
    tip.classList.add("pinned");
    tip.style.display = "block";
    tip.scrollTop = 0;
    // Im Netz liegt die Karte über der Seitenleiste und ersetzt sie; sonst neben dem Klick.
    const side = $("panel").getBoundingClientRect();
    const besides = view === "net" && !document.querySelector(".netz").classList.contains("wide") && side.left > innerWidth / 2;
    if (besides) {
      tip.style.left = Math.max(8, side.right - tip.offsetWidth) + "px";
      tip.style.top = Math.max(8, Math.min(side.top, innerHeight - tip.offsetHeight - 8)) + "px";

    const step = PATH.indexOf(n);
    const stepBtn = (m, text, label) => h("button", { class: "ghost", type: "button", "aria-label": label, title: m.title, onclick: () => go(m) }, text);
    const head = h("header", { class: "r-head" },
      step >= 0 ? h("div", { class: "r-path" }, h("span", { class: "step-n", "aria-hidden": "true" }, String(step + 1)),
        h("span", {}, `Lernpfad · Schritt ${step + 1} von ${PATH.length}`),
        step > 0 ? stepBtn(PATH[step - 1], "‹", `Zurück zu Schritt ${step}`) : null,
        step < PATH.length - 1 ? stepBtn(PATH[step + 1], "›", `Weiter mit Schritt ${step + 2}`) : null) : null,
      n.cite ? h("div", { class: "r-kicker" }, n.cite) : null,
      h("h1", compact ? {} : { id: "r-title" }, n.heading || n.title));
    const body = h("div", { class: "prose-content" });
    body.innerHTML = n.html; // im Kern aus Markdown erzeugt; rohes HTML der Seiten ist dort bereits maskiert
    const firstP = body.querySelector(":scope > p");
    if (n.description && !(firstP && firstP.textContent.trim() === n.description.trim())) head.append(h("p", { class: "r-desc" }, n.description));
    const facetBtn = (kind, value, text) => h("button", { class: "metalink", type: "button", title: `Alle Seiten: ${text}`, onclick: () => goFacet(kind, value) }, text);
    const meta = [visBadge(n), n.subtype ? facetBtn("s", n.subtype, lab(n.subfield, n.subtype)) : null,
      n.updated ? h("span", {}, `Stand ${day(n.updated)}`) : null].filter(Boolean);
    if (meta.length) head.append(h("div", { class: "r-meta" }, ...meta));
    root.append(head, body);
    if (step >= 0) {
      // weiter/zurück im Lernpfad direkt nach dem Text, vor Literatur und Verknüpfungen
      const prev = PATH[step - 1], next = PATH[step + 1];
      const big = (m, cls, label) => h("button", { class: cls, type: "button", onclick: () => go(m) },
        h("span", { class: "lbl" }, label), h("span", { class: "ttl" }, m.title));
      root.append(h("nav", { class: "r-pathnav", "aria-label": "Lernpfad" },
        prev ? big(prev, "prev", `← Schritt ${step}`) : null,
        next ? big(next, "next", `Schritt ${step + 2} →`) : h("span", { class: "end" }, "Ende des Lernpfads")));
    }
    root.addEventListener("click", ev => {
      const a = ev.target.closest("a");
      if (!a || !root.contains(a)) return;
      const href = a.getAttribute("href") || "";
      if (a.dataset.page) { ev.preventDefault(); const m = byId.get(a.dataset.page); if (m) go(m); }
      else if (a.classList.contains("missing")) ev.preventDefault();
      else if (href.startsWith("#")) {
        ev.preventDefault();
        const id = decodeURIComponent(href.slice(1));
        const t = [...root.querySelectorAll("[id]")].find(x => x.id === id); // nur in diesem Behälter suchen
        if (t) t.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    });
    if (n.refs.length) {
      const ol = h("ol", { class: "lit" });
      for (const r of n.refs) {
        const li = h("li", { id: r.key ? `lit-${r.key}` : "" });
        const entry = h("span", { class: "lit-entry" });
        entry.innerHTML = r.entry; // APA-Angabe aus citeproc (pandoc), Titel und Namen dort maskiert
        for (const a of entry.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
        li.append(entry);
        const metaEl = h("span", { class: "lit-meta" });
        if (r.access) metaEl.append(h("span", { class: "tag" + (r.access === "citation" ? " citation" : "") }, ACCESS[r.access] || r.access));
        const m = r.page ? byId.get(r.page) : null;
        if (m) metaEl.append(h("button", { class: "linkish", type: "button", onclick: () => go(m) }, "Quellenkarte"));
        li.append(metaEl);
        ol.append(li);
      }
      const ris = n.refs.map(r => (r.page && byId.get(r.page) ? byId.get(r.page).ris : "")).filter(Boolean).join("");
      root.append(h("section", { class: "r-section" }, h("h2", {}, "Literatur"), ol,
        ris ? h("div", { class: "r-actions" }, h("button", { class: "ghost", type: "button", onclick: () => download(`${slug(n)}-literatur.ris`, ris) }, "Literatur als RIS")) : null));
    }
    if (n.fundweg.length) {
      // Quellenkarte: wie die Quelle gefunden wurde (Suche mit Suchstring, Modellvorschlag, Zitatverfolgung …)
      const items = n.fundweg.map(f => {
        const von = f.von ? byId.get(`${(n.id.split("/")[0])}/${f.von}`) : null;
        return h("li", {}, facetBtn("f", f.art, FW[f.art] || f.art),
          f.db ? ` in ${f.db}` : "", f.query ? h("span", {}, ": ", h("code", {}, f.query)) : "",
          von ? h("span", {}, " aus ", h("button", { class: "linkish", type: "button", onclick: () => go(von) }, von.cite || von.title)) : (f.von ? ` aus ${f.von}` : ""),
          f.at ? h("span", { class: "r-note" }, ` · ${day(f.at)}`) : "");
      });
      root.append(h("section", { class: "r-section" }, h("h2", {}, "Fundweg"), h("ul", { class: "fundweg" }, ...items)));
    }
    if (n.license) {
      // Quellenkarte: welche Lizenz, wo der Volltext liegt, was damit erlaubt ist
      const L = n.license;
      const unknown = L.cls === "unbekannt" && L.known;
      const text = unknown ? "unbekannt" : L.name || L.url || "nicht angegeben";
      const name = L.url ? h("a", { href: L.url, target: "_blank", rel: "noopener" }, text) : h("span", {}, text);
      const same = unknown || (L.name || "").trim().toLowerCase() === L.label.toLowerCase();
      const lines = [h("p", { class: "r-lic" }, "Lizenz: ", name, " · ", facetBtn("l", L.cls, same ? "weitere Quellen mit dieser Lizenz" : L.label))];
      for (const st of n.stored) lines.push(h("p", { class: "r-lic" }, `Volltext: ${st.path} `, h("span", { class: "r-note" }, st.tracked ? "(von Git versioniert)" : "(lokal, nicht versioniert)")));
      // eingeklappt; die Lizenz steht in der Zeile zum Aufklappen
      const fold = h("details", { class: "r-fold" }, h("summary", {}, h("h2", {}, "Lizenz und Nutzungsrechte"),
        h("span", { class: "r-note" }, ` · ${licShort(n)}`)), ...lines, rightsTable(n.rights));
      root.append(h("section", { class: "r-section" }, fold));
    }
    if (n.apa) {
      // Quellenkarte: Literaturangabe (Vollbeleg) unten, zum Kopieren und als RIS für Literaturverwaltungen
      const entry = h("div", { class: "r-apa" });
      entry.innerHTML = n.apa; // APA-Angabe aus citeproc (pandoc), Titel und Namen dort maskiert
      for (const a of entry.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
      const copy = h("button", { class: "ghost", type: "button" }, "Kopieren");
      copy.addEventListener("click", () => copyText(entry.textContent.replace(/\s+/g, " ").trim(), copy));
      root.append(h("section", { class: "r-section", "aria-label": "Literaturangabe" }, entry,
        h("div", { class: "r-actions" }, copy,
          n.ris ? h("button", { class: "ghost", type: "button", onclick: () => download(`${slug(n)}.ris`, n.ris) }, "RIS herunterladen") : null)));
    }
    const refPages = new Set(n.refs.map(r => r.page).filter(Boolean));
    const outs = new Map([...n.outs].filter(([m]) => !refPages.has(m.id)));
    root.append(h("section", { class: "r-section" }, relatedDetails("Verweist auf", outs, go), relatedDetails("Verlinkt von", n.ins, go)));
  }
  // item ist eine Seite oder { facet: [kind, value] } für eine Übersichtsseite; anchor springt zu einer Stelle (offen-N)
  function openReader(item, how, anchor) {
    if (how === "link" && rCur && rCur !== item) rHist.push(rCur);
    if (how === "new") rHist.length = 0;
    rCur = item;
    unpin();
    hideTip();
    const card = $("r-card");
    card.replaceChildren();
    const go = m => openReader(m, "link"), goFacet = (k, v) => openReader({ facet: [k, v] }, "link");
    if (item.facet) fillFacet(card, item.facet[0], item.facet[1], false, go);
    else fillArticle(card, item, false, go, goFacet);
    reader.hidden = false;
    document.body.classList.add("reading");
    reader.scrollTop = 0;
    $("r-back").hidden = !rHist.length; // nur nach einem Link zu einer anderen Seite
    $("r-close").focus({ preventScroll: true });
    const spot = anchor ? [...card.querySelectorAll("[id]")].find(x => x.id === anchor) : null;
    if (spot) { spot.scrollIntoView({ block: "center" }); spot.classList.add("flash"); }
  }
  function closeReader() {
    if (reader.hidden) return;
    reader.hidden = true;
    document.body.classList.remove("reading");
    const n = rCur;
    rCur = null;
    rHist.length = 0;
    if (n && !n.facet) select(n, true);
  }
  $("r-close").addEventListener("click", () => closeReader());
  $("r-back").addEventListener("click", () => { const prev = rHist.pop(); if (prev) openReader(prev, "back"); });
  document.addEventListener("keydown", ev => {
    if (ev.key !== "Escape") return;
    if (!reader.hidden) closeReader();
    else if (pinned) { unpin(); hoverN = null; update(); }
  });

  // ---------------------------------------------------------------- Tabelle
  (function pages() {
    const t = $("pages");
    $("tablesum").textContent = `Alle Seiten (${nodes.length})`;
    const cols = [
      // viertes Feld: Sortierschlüssel, wenn er von der Anzeige abweicht (Art in der Reihenfolge der Spalten)
      ["Titel", n => n.title, false], ["Art", n => tlabel(n.type), false, n => typeOrder.indexOf(n.type)],
      ["Unterart", n => (n.subtype ? lab(n.subfield, n.subtype) : ""), false],
      ...(SC ? [[SC.label, n => (n.scope ? scopeLab(n.scope) + (n.scope_derived ? " (abgeleitet)" : "") : ""), false]] : []),
      ...(VIS ? [[VIS.label, n => (n.visibility ? visText(n) : ""), false]] : []),
      ...(licNodes.length ? [["Lizenz", n => licShort(n), false]] : []),
      ["Verbindungen", n => n.nb.size, true],
    ];
    let sortCol = cols.length - 1, dir = -1;
    const thead = h("thead"), tbody = h("tbody");
    t.append(thead, tbody);
    function draw() {
      const tr = h("tr");
      cols.forEach(([name, , num], i) => {
        const th = h("th", { class: num ? "num" : "", scope: "col", tabindex: "0" }, name);
        if (i === sortCol) th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending");
        const act = () => { if (sortCol === i) dir = -dir; else { sortCol = i; dir = num ? -1 : 1; } draw(); };
        th.addEventListener("click", act);
        th.addEventListener("keydown", ev => { if (ev.key === "Enter") act(); });
        tr.append(th);
      });
      tr.append(h("th", { scope: "col" }, ""));
      thead.replaceChildren(tr);
      const get = cols[sortCol][3] || cols[sortCol][1];
      const shown = nodes.filter(inScope);
      $("tablesum").textContent = shown.length === nodes.length ? `Alle Seiten (${nodes.length})` : `Seiten im gewählten ${SC.label} (${shown.length} von ${nodes.length})`;
      const rows = shown.sort((a, b) => { const x = get(a), y = get(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * dir || a.title.localeCompare(b.title); });
      tbody.replaceChildren(...rows.map(n => h("tr", { onclick: () => { select(n, true); document.querySelector(".netz").scrollIntoView({ behavior: "smooth", block: "start" }); } },
        h("td", {}, h("span", { class: "pill" }, dotSvg(paint(n), 11), n.title), n.description ? h("div", { class: "d" }, n.description) : null),
        ...cols.slice(1).map(([, f, num]) => h("td", { class: num ? "num" : "" }, String(f(n) ?? ""))),
        h("td", {}, h("button", { class: "ghost", type: "button", onclick: ev => { ev.stopPropagation(); openReader(n, "new"); } }, "Lesen")))));
    }
    draw();
    redrawTable = draw;
  })();

  // ---------------------------------------------------------------- Lernpfad
  (function learningPath() {
    if (!PATH.length) return;
    const ol = h("ol", { class: "steps" });
    PATH.forEach((n, i) => ol.append(h("li", { class: "step", onclick: () => openReader(n, "new") },
      h("span", { class: "step-n", "aria-hidden": "true" }, String(i + 1)),
      h("button", { class: "linkish", type: "button", "aria-label": `Schritt ${i + 1}: ${n.title}` }, n.title),
      h("span", { class: "step-k" }, typeDot(n.type), tlabel(n.type)),
      n.description ? h("span", { class: "step-d" }, n.description) : null)));
    $("lernpfad").append(h("div", { class: "lern-head" },
      h("div", {}, h("h2", { id: "lern-h" }, "Lernpfad"),
        h("div", { class: "note" }, `${PATH.length} ${PATH.length === 1 ? "Seite" : "Seiten"} zum Einlesen, in dieser Reihenfolge`)),
      h("button", { class: "btn-primary", type: "button", onclick: () => openReader(PATH[0], "new") }, "Lernpfad starten")), ol);
    $("lernpfad").hidden = false;
  })();

  // ---------------------------------------------------------------- Glossar: Titel, Aliase und Beschreibung der Begriffsseiten
  (function glossary() {
    const gtypes = new Set(D.glossary || []);
    const terms = nodes.filter(n => gtypes.has(n.type)).sort((a, b) => coll.compare(a.title, b.title));
    if (!terms.length) return;
    const letterOf = t => { const c = (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").charAt(0).toUpperCase(); return c >= "A" && c <= "Z" ? c : "#"; };
    const LETTERS = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ", "#"];
    const aka = n => { const seen = new Set([n.title.toLowerCase()]); return n.aliases.filter(a => !seen.has(a.toLowerCase()) && seen.add(a.toLowerCase())); };
    const from = typeOrder.filter(t => gtypes.has(t) && terms.some(n => n.type === t)).map(tlabel).join(" und ");
    const input = h("input", { type: "search", placeholder: "Begriff oder Alias …", "aria-label": "Glossar durchsuchen" });
    const letters = h("div", { class: "letters", role: "group", "aria-label": "Zum Anfangsbuchstaben springen" });
    const hits = h("span", { class: "hitcount", "aria-live": "polite" });
    const list = h("div", { class: "gl-cols" });
    $("glossbody").append(h("div", { class: "gl-bar" }, input, letters, hits), list);
    function draw() {
      const q = input.value.trim().toLowerCase();
      const inS = terms.filter(inScope);
      const shown = inS.filter(n => !q || [n.title, n.description, ...n.aliases].some(x => (x || "").toLowerCase().includes(q)));
      const groups = new Map();
      for (const n of shown) { const l = letterOf(n.title); if (!groups.has(l)) groups.set(l, []); groups.get(l).push(n); }
      list.replaceChildren(...[...groups].map(([l, ms]) => h("section", { class: "gl-group", id: `gl-${l}` }, h("h3", {}, l),
        h("dl", { class: "gl" }, ...ms.map(n => {
          const a = aka(n);
          return h("div", { class: "gl-entry" },
            h("dt", {}, h("button", { class: "linkish", type: "button", onclick: () => openReader(n, "new") }, n.title),
              h("span", { class: "kind pill" }, typeDot(n.type), tlabel(n.type))),
            n.description ? h("dd", {}, n.description) : null,
            a.length ? h("dd", { class: "aka" }, "Auch: " + a.join(" · ")) : null);
        })))));
      if (!shown.length) list.append(h("p", { class: "gl-empty" }, "Kein Begriff passt."));
      letters.replaceChildren(...LETTERS.filter(l => l !== "#" || groups.has("#")).map(l => h("button",
        groups.has(l) ? { type: "button", onclick: () => $(`gl-${l}`).scrollIntoView({ behavior: "smooth", block: "start" }) } : { type: "button", disabled: "" }, l)));
      hits.textContent = q ? `${shown.length} von ${inS.length}` : "";
      const part = inS.length < terms.length ? ` (im gewählten ${SC.label}, ${terms.length} insgesamt)` : "";
      $("glosssum").replaceChildren("Glossar", h("span", { class: "sumnote" }, ` · ${inS.length} ${inS.length === 1 ? "Begriff" : "Begriffe"} aus ${from}${part}`));
    }
    input.addEventListener("input", draw);
    draw();
    redrawGlossary = draw;
    $("glosscard").hidden = false;
  })();

  // ---------------------------------------------------------------- Offene Stellen: Widersprüche, „zu prüfen“, [!todo]
  (function openSpots() {
    const all = nodes.flatMap(n => (n.open || []).map(o => ({ n, ...o })));
    if (!all.length) return;
    const tOrder = Object.fromEntries(typeOrder.map((t, i) => [t, i]));
    const byPage = (a, b) => tOrder[a.n.type] - tOrder[b.n.type] || coll.compare(a.n.title, b.n.title);
    const NAMES = { contra: ["Widerspruch", "Widersprüche"], check: ["Stelle zu prüfen", "Stellen zu prüfen"], todo: ["offen", "offen"] };
    const go = o => openReader(o.n, "new", o.id);
    const snip = o => h("button", { class: "snip", type: "button", onclick: () => go(o) }, o.text || "(ohne Text)");
    function draw() {
      const shown = all.filter(o => inScope(o.n));
      const of = k => shown.filter(o => o.kind === k).sort(byPage);
      const contra = of("contra"), check = of("check"), todo = of("todo");
      const body = $("openbody");
      body.replaceChildren(h("p", { class: "note" }, "Was die Seiten selbst als Widerspruch, „zu prüfen“ oder offen ([!todo]) markieren. Ein Klick öffnet die Fundstelle in der Leseansicht."));
      for (const [k, list, title] of [["contra", contra, "Widersprüche"], ["check", check, "Zu prüfen"]]) {
        if (!list.length) continue;
        body.append(h("section", { class: "open-group" }, h("h3", {}, h("span", { class: `mark ${k}`, "aria-hidden": "true" }), `${title} (${list.length})`),
          h("ul", { class: "open-list" }, ...list.map(o => h("li", {},
            h("button", { class: "linkish", type: "button", onclick: () => go(o) }, o.n.title),
            h("span", { class: "kind pill" }, typeDot(o.n.type), tlabel(o.n.type)), h("div", {}, snip(o)))))));
      }
      if (todo.length) {
        const pages = new Map();
        for (const o of todo) { if (!pages.has(o.n)) pages.set(o.n, []); pages.get(o.n).push(o); }
        const det = h("details", { class: "sub" }, h("summary", {}, h("span", { class: "mark todo", "aria-hidden": "true" }),
          ` Offen ([!todo]): ${todo.length} ${todo.length === 1 ? "Stelle" : "Stellen"} auf ${pages.size} ${pages.size === 1 ? "Seite" : "Seiten"}`));
        // erst beim Aufklappen aufbauen: in großen Wikis sind es über tausend Stellen
        det.addEventListener("toggle", () => {
          if (!det.open || det.dataset.built) return;
          det.dataset.built = "1";
          det.append(h("ul", { class: "open-list" }, ...[...pages].map(([n, os]) => h("li", {}, h("details", {},
            h("summary", {}, n.title, h("span", { class: "sumnote" }, ` · ${tlabel(n.type)} · ${os.length}`)),
            h("ul", { class: "open-list" }, ...os.map(o => h("li", {}, snip(o)))))))));
        });
        body.append(det);
      }
      if (!shown.length) body.append(h("p", { class: "gl-empty" }, "Im gewählten Umfang keine offenen Stellen."));
      const parts = [["contra", contra], ["check", check], ["todo", todo]].filter(([, l]) => l.length)
        .map(([k, l]) => `${l.length} ${NAMES[k][l.length === 1 ? 0 : 1]}`);
      const part = shown.length < all.length ? ` (im gewählten ${SC.label}, ${all.length} insgesamt)` : "";
      $("opensum").replaceChildren("Offene Stellen", h("span", { class: "sumnote" }, ` · ${parts.join(" · ") || "keine"}${part}`));
    }
    draw();
    redrawOpen = draw;
    $("opencard").hidden = false;
  })();

  // Sprungleiste im Kopf zu den Abschnitten unter dem Graphen
  (function jump() {
    const targets = [["lernpfad", "Lernpfad"], ["glosscard", "Glossar"], ["opencard", "Offene Stellen"], ["tablecard", "Alle Seiten"]]
      .filter(([id]) => !$(id).hidden);
    if (targets.length < 2) return;
    $("jump").append(...targets.map(([id, label]) => h("button", { class: "linkish", type: "button", onclick: () => {
      const el = $(id);
      if (el.tagName === "DETAILS") el.open = true;
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    } }, label)));
    $("jump").hidden = false;
  })();

  // ---------------------------------------------------------------- Hell oder dunkel
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $("th-light").setAttribute("aria-pressed", String(t === "light"));
    $("th-dark").setAttribute("aria-pressed", String(t === "dark"));
    try { localStorage.setItem("okfw-theme", t); } catch (e) { /* ohne Speicher */ }
  }
  $("th-light").addEventListener("click", () => setTheme("light"));
  $("th-dark").addEventListener("click", () => setTheme("dark"));
  setTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");

  const allRis = nodes.map(n => n.ris).filter(Boolean);
  $("foot").replaceChildren(`Stand ${day(D.generated)} · erzeugt mit okfw`,
    allRis.length ? h("button", { class: "linkish", type: "button", style: "margin-left:12px", onclick: () => download("quellen.ris", allRis.join("")) }, `Alle ${allRis.length} Quellen als RIS`) : "");
  repaint();
  colorKey();
  renderPanel();
  fit();
  update();
  try { if (localStorage.getItem("okfw-view") === "cols") setView("cols"); } catch (e) { /* ohne Speicher */ }
})();
</script>
</body>
</html>
