dert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Die Vorlage für Pull Requests hat drei Teile: eine Zusammenfassung, vier Prüfpunkte zur Validierung und eine Prüfliste mit vier Punkten.", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026d, Oktober 24). \u003cem>Pull request template\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/.github/pull_request_template.md\u003c/a>", "open": [], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-pre-commit", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-pre-commit", "title": "Pre-commit configuration and setup script", "type": "source", "description": "Die Hooks, die pre-commit vor jedem Commit ausführt, der erzeugte Git-Hook und das Einrichtungsskript.", "access": "fulltext", "in": 6, "out": 4, "domain": [], "subtype": "code", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026c", "ris": "TY  - COMP\r\nAU  - mims-harvard\r\nTI  - Pre-commit configuration and setup script\r\nPB  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Pre-commit configuration and setup script", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>\u003ccode>.pre-commit-config.yaml\u003c/code> bestimmt, welche Hooks pre-commit vor jedem Commit ausführt. Der Hook in\n\u003ccode>.githooks/pre-commit\u003c/code> ist von pre-commit erzeugt, \u003ccode>setup_precommit.sh\u003c/code> installiert pre-commit und die Hooks.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Die Hooks gelten nur für Dateien unter \u003ccode>src/tooluniverse/\u003c/code> (.pre-commit-config.yaml, Zeile 1).\u003c/li>\n\u003cli>Aktiv sind \u003ccode>end-of-file-fixer\u003c/code>, \u003ccode>trailing-whitespace\u003c/code>, \u003ccode>check-yaml\u003c/code> und \u003ccode>check-toml\u003c/code> aus pre-commit-hooks\n  v6.0.0 sowie \u003ccode>ruff-check\u003c/code> mit \u003ccode>--fix\u003c/code> und \u003ccode>ruff-format\u003c/code> aus ruff-pre-commit v0.14.7 (Zeile 10–26).\u003c/li>\n\u003cli>Der Hook in \u003ccode>.githooks/pre-commit\u003c/code> ist von pre-commit erzeugt und ruft pre-commit mit dieser Konfiguration auf\n  (pre-commit, Zeile 2–7).\u003c/li>\n\u003cli>\u003ccode>setup_precommit.sh\u003c/code> installiert pre-commit bei Bedarf mit \u003ccode>pip\u003c/code> und richtet die Hooks mit\n  \u003ccode>pre-commit install\u003c/code> ein; von Hand laufen sie mit \u003ccode>pre-commit run --all-files\u003c/code> (setup_precommit.sh,\n  Zeile 23–40).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die Leitfäden in \u003ca data-page=\"sources/tu-expand-contributing\" href=\"#sources/tu-expand-contributing\">Expand ToolUniverse\u003c/a> kündigen beim\nCommit Black, Flake8 und Ruff an; diese Konfiguration enthält von den dreien nur Ruff (Zeile 10–26).\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Zeigt, was beim Commit wirklich geprüft wird, und dass Dateien in \u003ccode>tests/\u003c/code> oder \u003ccode>docs/\u003c/code> nicht erfasst sind.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"entities/pre-commit\" href=\"#entities/pre-commit\">pre-commit\u003c/a>, \u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-pre-commit\u003c/code> (\u003ccode>.pre-commit-config.yaml\u003c/code>, \u003ccode>.githooks/pre-commit\u003c/code>,\n\u003ccode>setup_precommit.sh\u003c/code>), unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": ".pre-commit-config.yaml bestimmt, welche Hooks pre-commit vor jedem Commit ausführt. Der Hook in .githooks/pre-commit ist von pre-commit erzeugt, setup_precommit.sh installiert pre-commit und die Hooks.", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026c). \u003cem>Pre-commit configuration and setup script\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Die Leitfäden in Expand ToolUniverse kündigen beim Commit Black, Flake8 und Ruff an; diese Konfiguration enthält von den dreien nur Ruff (Zeile 10–26)."}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-readme", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-readme", "title": "ToolUniverse: Democratizing AI scientists (README)", "type": "source", "description": "README des Repositorys mit Installation für Agenten, Claude Code und Python, Funktionsliste und Datenschutz.", "access": "fulltext", "in": 3, "out": 3, "domain": [], "subtype": "documentation", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026k", "ris": "TY  - ELEC\r\nAU  - mims-harvard\r\nTI  - ToolUniverse: Democratizing AI scientists (README)\r\nT2  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "ToolUniverse: Democratizing AI scientists (README)", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Das README stellt ToolUniverse als Ökosystem vor, mit dem sich aus einem beliebigen Sprachmodell\nKI-Wissenschaftssysteme bauen lassen. Es beschreibt drei Installationswege (über einen KI-Agenten, als\nClaude-Code-Plugin, als Python-SDK), listet die Funktionen mit Links in die Doku und endet mit Community,\nDatenschutz und Zitierhinweis.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>ToolUniverse legt über das AI-Tool Interaction Protocol fest, wie Sprachmodelle Tools finden und aufrufen,\n  und bindet nach eigener Angabe mehr als 1000 ML-Modelle, Datensätze, APIs und wissenschaftliche Pakete ein\n  (Zeile 88).\u003c/li>\n\u003cli>Für die Python-Entwicklung rät das README zu \u003ccode>uv\u003c/code> statt System-\u003ccode>pip\u003c/code>: Auf einem aktuellen Mac scheitere\n  \u003ccode>pip install tooluniverse\u003c/code> an \u003ccode>externally-managed-environment\u003c/code> (PEP 668), und \u003ccode>python3 -m venv\u003c/code> könne an\n  \u003ccode>ensurepip\u003c/code> scheitern (Zeile 62).\u003c/li>\n\u003cli>Vorausgesetzt ist Python 3.10 oder neuer, auf Apple-Silicon-Macs zusätzlich macOS 14, weil \u003ccode>faiss-cpu\u003c/code>\n  für ältere Versionen keine arm64-Wheels anbietet (Zeile 69).\u003c/li>\n\u003cli>In Claude Code genügen zwei Befehle: Marketplace \u003ccode>mims-harvard/ToolUniverse\u003c/code> hinzufügen und das Plugin\n  \u003ccode>tooluniverse@tooluniverse\u003c/code> installieren (Zeile 56–60).\u003c/li>\n\u003cli>Die Funktionsliste nennt einen MCP-Server, die CLI \u003ccode>tu\u003c/code> mit 9 Unterbefehlen und 68 vorgefertigte\n  Forschungs-Workflows als Agent Skills (Zeile 94–99); neue Tools lassen sich lokal oder remote registrieren\n  (Zeile 102).\u003c/li>\n\u003cli>ToolUniverse läuft lokal und sammelt keine Telemetrie; Tool-Argumente gehen nur an den Datenanbieter des\n  jeweiligen Tools (Zeile 147–154).\u003c/li>\n\u003c/ul>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Einstieg ins Projekt und Maßstab für die Installation. Für Beiträge verweist das README auf den Bereich\n„Expand ToolUniverse“ der Doku (Zeile 133).\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"entities/tooluniverse\" href=\"#entities/tooluniverse\">ToolUniverse\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/skills-beitragen\" href=\"#concepts/skills-beitragen\">Agent-Skills beitragen\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-readme\u003c/code>, unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Das README stellt ToolUniverse als Ökosystem vor, mit dem sich aus einem beliebigen Sprachmodell KI-Wissenschaftssysteme bauen lassen. Es beschreibt drei Installationswege (über einen KI-Agenten, als Claude-Code-Plugin, als Python-SDK), listet die Funktionen mit Links in die Doku und endet mit Community, Datenschutz …", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026k, Oktober 24). \u003cem>ToolUniverse: Democratizing AI scientists (README)\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/README.md\u003c/a>", "open": [], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-skills-and-githooks", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-skills-and-githooks", "title": "ToolUniverse Skills (README), Git hooks and skill call check", "type": "source", "description": "README der Agent-Skills, die Hooks pre-push und pre-commit-docs und das Skript, das Tool-Aufrufe in Skills prüft.", "access": "fulltext", "in": 7, "out": 4, "domain": [], "subtype": "code", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026j", "ris": "TY  - COMP\r\nAU  - mims-harvard\r\nTI  - ToolUniverse Skills (README), Git hooks and skill call check\r\nPB  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "ToolUniverse Skills (README), Git hooks and skill call check", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Das README in \u003ccode>skills/\u003c/code> listet die vorgefertigten Forschungs- und Entwickler-Skills und beschreibt Aufbau und\nBeitrag. Die Hooks \u003ccode>.githooks/pre-push\u003c/code> und \u003ccode>.githooks/pre-commit-docs\u003c/code> prüfen Pushes und Änderungen an der\nDoku. \u003ccode>scripts/check_skill_tool_calls.py\u003c/code> prüft Tool-Aufrufe in Skill-Texten gegen die echten Schemas.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Installation der Skills mit \u003ccode>npx skills add mims-harvard/ToolUniverse\u003c/code> (README.md, Zeile 12–16); das README\n  spricht von 69 Forschungs-Skills (Zeile 3), seine Tabelle hat 69 Zeilen einschließlich des Routers\n  \u003ccode>tooluniverse\u003c/code> (Zeile 20–92).\u003c/li>\n\u003cli>Ein Skill ist ein Ordner mit \u003ccode>SKILL.md\u003c/code> (unter 500 Zeilen) und optional \u003ccode>QUICK_START.md\u003c/code>, \u003ccode>EXAMPLES.md\u003c/code> und\n  \u003ccode>references/\u003c/code> (README.md, Zeile 130–138).\u003c/li>\n\u003cli>Beitrag: \u003ccode>SKILL.md\u003c/code> mit Frontmatter, knapp halten, Beispiele ergänzen, keine host-spezifischen Metadaten wie\n  \u003ccode>agents/openai.yaml\u003c/code> im kanonischen Skill; den vollen Ablauf beschreibt der Skill \u003ccode>create-tooluniverse-skill\u003c/code>\n  (README.md, Zeile 140–148).\u003c/li>\n\u003cli>Der Pre-Push-Hook bricht ab bei hinzugefügten oder geänderten Markdown-Dateien im Wurzelordner mit Namen wie\n  \u003ccode>_SUMMARY\u003c/code>, \u003ccode>_REPORT\u003c/code> oder \u003ccode>SESSION_\u003c/code>, bei Testskripten \u003ccode>test_*.py\u003c/code> im Wurzelordner, bei einer \u003ccode>.env\u003c/code> und bei\n  Dateien aus \u003ccode>temp_docs_and_tests/\u003c/code> (pre-push, Zeile 9–52).\u003c/li>\n\u003cli>\u003ccode>pre-commit-docs\u003c/code> prüft geänderte \u003ccode>.rst\u003c/code>- und \u003ccode>.md\u003c/code>-Dateien vor dem Commit (pre-commit-docs, Zeile 2–25); es\n  meldet nur Warnungen und lässt den Commit zu, denn der Fehlerzähler wird nie erhöht (Zeile 16, 139–152).\u003c/li>\n\u003cli>\u003ccode>check_skill_tool_calls.py\u003c/code> prüft statisch, ob Tool-Aufrufe in Skill-Texten nur deklarierte Argumente nutzen,\n  keine Pflichtargumente fehlen und die Tool-Namen existieren; unbekannte Namen meldet es nur, wenn mindestens\n  zwei echte Tools dasselbe Präfix tragen. Die Schemas liest es aus \u003ccode>src/tooluniverse/data/*.json\u003c/code>, ausgeführt\n  wird nichts (check_skill_tool_calls.py, Zeile 2–23, 52–55, 132–140).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Der Pre-Push-Hook weist Markdown-Dateien mit \u003ccode>_REPORT\u003c/code> im Namen im Wurzelordner ab\n(pre-push, Zeile 9–20); die README der \u003ca data-page=\"sources/tu-tool-test-scripts\" href=\"#sources/tu-tool-test-scripts\">Tool-Testskripte\u003c/a> empfiehlt, den\nBericht \u003ccode>TOOL_TEST_REPORT.md\u003c/code> zu committen.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Für Beiträge zu Skills die einzige Quelle in diesem Wiki; die Hooks betreffen jeden Push.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/skills-beitragen\" href=\"#concepts/skills-beitragen\">Agent-Skills beitragen\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-skills-and-githooks\u003c/code> (\u003ccode>skills/README.md\u003c/code>, \u003ccode>.githooks/pre-push\u003c/code>,\n\u003ccode>.githooks/pre-commit-docs\u003c/code>, \u003ccode>scripts/check_skill_tool_calls.py\u003c/code>), unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>,\nApache-2.0.\u003c/p>", "excerpt": "Das README in skills/ listet die vorgefertigten Forschungs- und Entwickler-Skills und beschreibt Aufbau und Beitrag. Die Hooks .githooks/pre-push und .githooks/pre-commit-docs prüfen Pushes und Änderungen an der Doku. scripts/check_skill_tool_calls.py prüft Tool-Aufrufe in Skill-Texten gegen die echten Schemas.", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026j). \u003cem>ToolUniverse Skills (README), Git hooks and skill call check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Der Pre-Push-Hook weist Markdown-Dateien mit _REPORT im Namen im Wurzelordner ab (pre-push, Zeile 9–20); die README der Tool-Testskripte empfiehlt, den Bericht TOOL_TEST_REPORT.md zu committen."}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-test-writing-guide", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-test-writing-guide", "title": "Test Writing Guide for ToolUniverse", "type": "source", "description": "Leitfaden, wie Tests mit verschachtelten und flachen Tool-Antworten umgehen, mit Mustern, Beispielen und Prüfliste.", "access": "fulltext", "in": 4, "out": 4, "domain": [], "subtype": "documentation", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026g", "ris": "TY  - ELEC\r\nAU  - mims-harvard\r\nTI  - Test Writing Guide for ToolUniverse\r\nT2  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/TEST_WRITING_GUIDE.md\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Test Writing Guide for ToolUniverse", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Der Leitfaden für Entwickler:innen beschreibt, wie Tests mit Tool-Antworten umgehen, deren Daten verschachtelt\noder flach stehen, mit Mustern, Beispielen aus korrigierten Testdateien, guter Praxis und einer Prüfliste.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Antworten haben ein Feld \u003ccode>status\u003c/code>; die Daten stehen entweder verschachtelt unter \u003ccode>data\u003c/code> (neu) oder flach\n  daneben (alt) (Zeile 3–27).\u003c/li>\n\u003cli>Tests sollen beide Formen abdecken, etwa mit \u003ccode>result.get(\"data\", result)\u003c/code> (Zeile 29–50, 173).\u003c/li>\n\u003cli>Fehlerantworten stehen immer auf oberster Ebene, mit \u003ccode>status: \"error\"\u003c/code> und einem Text in \u003ccode>error\u003c/code>\n  (Zeile 87–94); im Beispiel sind \u003ccode>success\u003c/code>, \u003ccode>error\u003c/code> und \u003ccode>warning\u003c/code> als Status erlaubt (Zeile 103–105).\u003c/li>\n\u003cli>Gute Praxis: zuerst \u003ccode>status\u003c/code> prüfen, \u003ccode>.get()\u003c/code> für optionale Felder, Erfolg und Fehler testen, langsame APIs in\n  Unit-Tests mocken (Zeile 169–176).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Der Leitfaden geht davon aus, dass jede Antwort ein Feld \u003ccode>status\u003c/code> hat (Zeile 171); die\n\u003ca data-page=\"sources/tu-adding-tools-quickref\" href=\"#sources/tu-adding-tools-quickref\">Kurzreferenz\u003c/a> verlangt als einheitliches Format \u003ccode>success: True/False\u003c/code>,\nihre Beispiele haben kein \u003ccode>status\u003c/code>.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-2\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Nach dem Leitfaden stehen Fehler immer auf oberster Ebene (Zeile 87–94); das\n\u003ca data-page=\"sources/tu-tool-test-scripts\" href=\"#sources/tu-tool-test-scripts\">Testskript\u003c/a> hält fest, dass viele Tools den Fehler in \u003ccode>data\u003c/code> legen.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Legt das Antwortformat fest, gegen das Tests und das Testskript prüfen.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-test-writing-guide\u003c/code>, unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Der Leitfaden für Entwickler:innen beschreibt, wie Tests mit Tool-Antworten umgehen, deren Daten verschachtelt oder flach stehen, mit Mustern, Beispielen aus korrigierten Testdateien, guter Praxis und einer Prüfliste.", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026g, Oktober 24). \u003cem>Test Writing Guide for ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/TEST_WRITING_GUIDE.md\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/dev_docs/TEST_WRITING_GUIDE.md\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Der Leitfaden geht davon aus, dass jede Antwort ein Feld status hat (Zeile 171); die Kurzreferenz verlangt als einheitliches Format success: True/False, ihre Beispiele haben kein status."}, {"kind": "contra", "id": "offen-2", "text": "Nach dem Leitfaden stehen Fehler immer auf oberster Ebene (Zeile 87–94); das Testskript hält fest, dass viele Tools den Fehler in data legen."}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-tests-and-ci", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-tests-and-ci", "title": "Test suite, pytest configuration and CI workflow", "type": "source", "description": "README der Testsuite, pytest.ini, der CI-Workflow tests.yml und die Liste bekannter Ausfälle der Wochenprüfung.", "access": "fulltext", "in": 13, "out": 4, "domain": [], "subtype": "code", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026f", "ris": "TY  - COMP\r\nAU  - mims-harvard\r\nTI  - Test suite, pytest configuration and CI workflow\r\nPB  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Test suite, pytest configuration and CI workflow", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Das README der Testsuite (\u003ccode>tests/README.md\u003c/code>) beschreibt Ordner, Marker und Standards; \u003ccode>pytest.ini\u003c/code> legt fest,\nwas ein einfacher \u003ccode>pytest\u003c/code>-Aufruf sammelt; \u003ccode>.github/workflows/tests.yml\u003c/code> ist der CI-Workflow für Push und Pull\nRequest auf \u003ccode>main\u003c/code>; \u003ccode>.github/known_failing_categories.txt\u003c/code> listet Kategorien, die die Wochenprüfung aus\nbekannten Gründen meldet.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>Ordner: \u003ccode>unit/\u003c/code> ohne Netz, \u003ccode>integration/\u003c/code> mit Netz oder echten Tools, \u003ccode>tools/\u003c/code> je Tool, \u003ccode>api/\u003c/code> für externe\n  Dienste, \u003ccode>helpers/\u003c/code> für Hilfsmittel (README.md, Zeile 3–9).\u003c/li>\n\u003cli>Standards: jeder Test mit Marker, Namen nach \u003ccode>test_&lt;was&gt;_&lt;erwartung&gt;\u003c/code>, Unit-Tests ohne Netz und unter einer\n  Sekunde, ein Docstring je Test (README.md, Zeile 37–43).\u003c/li>\n\u003cli>Ein einfacher \u003ccode>pytest\u003c/code>-Aufruf sammelt in \u003ccode>tests/unit\u003c/code>, \u003ccode>tests/integration\u003c/code> und \u003ccode>tests/test_database_setup\u003c/code>\n  (\u003ccode>tools\u003c/code>, \u003ccode>examples\u003c/code> und \u003ccode>api\u003c/code> sind ausgenommen), wählt Tests ohne die Marker \u003ccode>slow\u003c/code>, \u003ccode>require_api_keys\u003c/code> und\n  \u003ccode>network\u003c/code> und misst die Abdeckung mit; unbekannte Marker sind wegen \u003ccode>--strict-markers\u003c/code> ein Fehler\n  (pytest.ini, Zeile 3–10).\u003c/li>\n\u003cli>Die CI läuft bei Push und Pull Request auf \u003ccode>main\u003c/code> (tests.yml, Zeile 3–7): ein Wheel-Test unter Python 3.10\n  bis 3.14 (Zeile 10–94) und der Testjob unter Python 3.12 (Zeile 96–101).\u003c/li>\n\u003cli>Im Testjob läuft die Ruff-Action in Version 0.15.22 (Zeile 130–133). Ein eigener Schritt prüft, ob die\n  committeten erzeugten Dateien zu ihren Generatoren passen (Zeile 142–171), ein weiterer die Beispiele der Doku\n  (Zeile 182–183). Unit- und Integrationstests laufen parallel, ohne \u003ccode>slow\u003c/code>, \u003ccode>require_api_keys\u003c/code>, \u003ccode>network\u003c/code> und\n  \u003ccode>require_gpu\u003c/code>, mit einem Zeitlimit von 30 Minuten (Zeile 185–200).\u003c/li>\n\u003cli>Der Schritt für \u003ccode>tools/\u003c/code>, \u003ccode>examples/\u003c/code> und \u003ccode>api/\u003c/code> ist an einen manuellen Start (\u003ccode>workflow_dispatch\u003c/code>) gebunden,\n  den der Workflow unter \u003ccode>on:\u003c/code> nicht vorsieht; in diesem Workflow läuft er damit nicht (Zeile 3–7, 211–216).\u003c/li>\n\u003cli>Die Liste bekannter Ausfälle nennt Kategorien, die die Wochenprüfung aus Gründen außerhalb des Codes meldet;\n  jede andere Kategorie ist ein Grund nachzusehen (known_failing_categories.txt, Zeile 1–12).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Das README der Testsuite sagt, \u003ccode>pytest\u003c/code> ohne Argumente führe nur Unit-Tests aus\n(README.md, Zeile 15); nach \u003ccode>pytest.ini\u003c/code> sammelt derselbe Aufruf auch in \u003ccode>tests/integration\u003c/code> und\n\u003ccode>tests/test_database_setup\u003c/code> (Zeile 3–9).\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Maßgeblich dafür, was lokal und in der CI tatsächlich läuft; bei Abweichungen gilt die Konfiguration, nicht\ndas README.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"entities/pytest\" href=\"#entities/pytest\">pytest\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-tests-and-ci\u003c/code> (\u003ccode>tests/README.md\u003c/code>, \u003ccode>pytest.ini\u003c/code>, \u003ccode>.github/workflows/tests.yml\u003c/code>,\n\u003ccode>.github/known_failing_categories.txt\u003c/code>), unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Das README der Testsuite (tests/README.md) beschreibt Ordner, Marker und Standards; pytest.ini legt fest, was ein einfacher pytest-Aufruf sammelt; .github/workflows/tests.yml ist der CI-Workflow für Push und Pull Request auf main; .github/known_failing_categories.txt listet Kategorien, die die Wochenprüfung aus …", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026f). \u003cem>Test suite, pytest configuration and CI workflow\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Das README der Testsuite sagt, pytest ohne Argumente führe nur Unit-Tests aus (README.md, Zeile 15); nach pytest.ini sammelt derselbe Aufruf auch in tests/integration und tests/test_database_setup (Zeile 3–9)."}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-tool-registry-code", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-tool-registry-code", "title": "Tool registry and automatic discovery (source code)", "type": "source", "description": "Paket-Einstieg __init__.py, tool_registry.py mit register_tool und AST-Suche, generate_lazy_registry.py für die statische Registry.", "access": "fulltext", "in": 8, "out": 5, "domain": [], "subtype": "code", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026h", "ris": "TY  - COMP\r\nAU  - mims-harvard\r\nTI  - Tool registry and automatic discovery (source code)\r\nPB  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Tool registry and automatic discovery (source code)", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>Der Paket-Einstieg \u003ccode>src/tooluniverse/__init__.py\u003c/code> löst Tool-Klassen dynamisch über die Registry auf.\n\u003ccode>tool_registry.py\u003c/code> enthält den Dekorator \u003ccode>register_tool\u003c/code>, die Suche nach dekorierten Klassen im Quelltext (AST)\nund den Aufbau der Lazy Registry. \u003ccode>generate_lazy_registry.py\u003c/code> schreibt eine statische Fassung für gebündelte\nUmgebungen.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>register_tool\u003c/code> trägt die Klasse unter dem angegebenen Namen, sonst unter dem Klassennamen, in die Registry\n  ein; eine mitgegebene Konfiguration kommt zusätzlich in die Konfigurations-Registry (tool_registry.py,\n  Zeile 58–89).\u003c/li>\n\u003cli>Die AST-Suche durchläuft das Paket ohne Ordner wie \u003ccode>data\u003c/code>, \u003ccode>tools\u003c/code>, \u003ccode>remote\u003c/code>, \u003ccode>scripts\u003c/code> und \u003ccode>tests\u003c/code>,\n  überspringt Dateien wie \u003ccode>__init__.py\u003c/code> und \u003ccode>main.py\u003c/code> und erfasst jede öffentliche Klasse auf oberster Ebene mit\n  \u003ccode>@register_tool(...)\u003c/code>; in Dateien auf \u003ccode>_tool.py\u003c/code> oder \u003ccode>_tools.py\u003c/code>, einer älteren Namenskonvention, jede\n  öffentliche Klasse (Zeile 242–351).\u003c/li>\n\u003cli>Die vollständige Erkennung, die alle Tool-Module sofort importiert, lädt dagegen nur Module auf oberster Ebene\n  mit \u003ccode>_tool\u003c/code> im Namen (Zeile 688–701). Sie greift, wenn Lazy Loading abgeschaltet ist (\u003ccode>__init__.py\u003c/code>,\n  Zeile 179–182), und als Rückfall, wenn die Lazy Registry ein Tool nicht kennt (Zeile 729–736).\u003c/li>\n\u003cli>Liegt eine statische Registry vor, wird sie geladen und um die Funde der AST-Suche ergänzt, damit neue\n  Tool-Dateien ohne Neubau gefunden werden (Zeile 354–392); sonst ist die AST-Suche die Quelle\n  (Zeile 393–415).\u003c/li>\n\u003cli>\u003ccode>__getattr__\u003c/code> im Paket-Einstieg ersetzt die frühere manuelle Liste \u003ccode>_LazyImportProxy\u003c/code> und holt Tool-Klassen\n  aus der Registry (\u003ccode>__init__.py\u003c/code>, Zeile 122–166); die gefundenen Tools kommen von selbst in \u003ccode>__all__\u003c/code>\n  (Zeile 209–217). Lazy Loading ist Standard (\u003ccode>TOOLUNIVERSE_LAZY_LOADING\u003c/code>, Zeile 58–61).\u003c/li>\n\u003cli>\u003ccode>generate_lazy_registry.py\u003c/code> schreibt \u003ccode>_lazy_registry_static.py\u003c/code> für eingefrorene oder gebündelte Umgebungen\n  ohne Quelldateien (generate_lazy_registry.py, Zeile 2–5, 43–61).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Der Leitfaden für lokale Tools in \u003ca data-page=\"sources/tu-expand-contributing\" href=\"#sources/tu-expand-contributing\">Expand ToolUniverse\u003c/a>\nnennt Änderungen an \u003ccode>__init__.py\u003c/code> an vier Stellen als nötig; nach diesem Code findet die Registry dekorierte\nKlassen selbst und ergänzt \u003ccode>__all__\u003c/code> (\u003ccode>__init__.py\u003c/code>, Zeile 122–166, 209–217; tool_registry.py, Zeile 242–351).\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-2\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die \u003ca data-page=\"sources/tu-adding-tools-quickref\" href=\"#sources/tu-adding-tools-quickref\">Kurzreferenz\u003c/a> verlangt die Endung \u003ccode>_tool.py\u003c/code>\nohne Einschränkung; hier hängt es vom Weg ab: Die Lazy-Suche (Standard) braucht die Endung nur für Klassen\nohne Dekorator (tool_registry.py, Zeile 297–302, 343–344), die vollständige Erkennung lädt nur Module mit\n\u003ccode>_tool\u003c/code> im Namen (Zeile 688–701).\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Klärt die beiden wichtigsten Widersprüche der Doku zur Registrierung; für einen Beitrag reichen Dekorator und\nOrt der Datei.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-tool-registry-code\u003c/code> (\u003ccode>src/tooluniverse/__init__.py\u003c/code>, \u003ccode>tool_registry.py\u003c/code>,\n\u003ccode>generate_lazy_registry.py\u003c/code>), unverändert, Stand Commit \u003ccode>5f9d8b1\u003c/code>, Apache-2.0.\u003c/p>", "excerpt": "Der Paket-Einstieg src/tooluniverse/__init__.py löst Tool-Klassen dynamisch über die Registry auf. tool_registry.py enthält den Dekorator register_tool, die Suche nach dekorierten Klassen im Quelltext (AST) und den Aufbau der Lazy Registry. generate_lazy_registry.py schreibt eine statische Fassung für gebündelte …", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026h). \u003cem>Tool registry and automatic discovery (source code)\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079/src/tooluniverse\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Der Leitfaden für lokale Tools in Expand ToolUniverse nennt Änderungen an __init__.py an vier Stellen als nötig; nach diesem Code findet die Registry dekorierte Klassen selbst und ergänzt __all__ (__init__.py, Zeile …"}, {"kind": "contra", "id": "offen-2", "text": "Die Kurzreferenz verlangt die Endung _tool.py ohne Einschränkung; hier hängt es vom Weg ab: Die Lazy-Suche (Standard) braucht die Endung nur für Klassen ohne Dekorator (tool_registry.py, Zeile 297–302, 343–344), die …"}], "updated": "2026-10-25"}, {"license": {"name": "Apache-2.0", "url": "https://www.apache.org/licenses/LICENSE-2.0", "cls": "by", "label": "Namensnennung", "known": true}, "rights": [["zitieren", "ja", ""], ["volltext_ablegen", "ja", ""], ["volltext_weitergeben", "bedingt", "mit Namensnennung und Lizenzangabe"], ["abbildung", "bedingt", "mit Namensnennung und Lizenzangabe"], ["bearbeiten", "bedingt", "mit Namensnennung und Lizenzangabe, Änderungen kennzeichnen"], ["ki_auswertung", "ja", ""], ["kommerziell", "ja", ""]], "stored": [{"path": "raw/tu-tool-test-scripts", "tracked": true}], "fundweg": [{"art": "material", "at": "2026-10-25", "by": "claude-code/claude-opus-5-5"}], "scope": "", "scope_derived": false, "id": "sources/tu-tool-test-scripts", "title": "Tool test scripts and weekly health check", "type": "source", "description": "test_new_tools.py, die README zu test_all_tools.py und der Wochen-Workflow, der die Tools ohne Remote- und MCP-Tools gegen die echten APIs prüft.", "access": "fulltext", "in": 9, "out": 5, "domain": [], "subtype": "code", "subfield": "format", "tags": [], "aliases": [], "cite": "mims-harvard, 2026i", "ris": "TY  - COMP\r\nAU  - mims-harvard\r\nTI  - Tool test scripts and weekly health check\r\nPB  - GitHub\r\nPY  - 2026\r\nDA  - 2026/10/24/\r\nUR  - https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\r\nY2  - 2026/10/25/\r\nER  - \r\n", "heading": "Tool test scripts and weekly health check", "html": "\u003ch2>Kurzreferat\u003c/h2>\n\u003cp>\u003ccode>scripts/test_new_tools.py\u003c/code> testet Tools mit den Beispielen und dem Rückgabeschema aus ihrer Konfiguration.\nDie README \u003ccode>scripts/README_TEST_ALL_TOOLS.md\u003c/code> beschreibt \u003ccode>test_all_tools.py\u003c/code>, das alle Konfigurationen nach\nPräfix gruppiert durchläuft und einen Bericht schreibt. \u003ccode>.github/workflows/weekly-tool-healthcheck.yml\u003c/code> lässt\ndiese Prüfung einmal in der Woche gegen die echten APIs laufen.\u003c/p>\n\u003ch2>Kernaussagen\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>test_new_tools.py\u003c/code> liest je Tool \u003ccode>test_examples\u003c/code> und \u003ccode>return_schema\u003c/code> und prüft, ob der Aufruf ohne Fehler\n  läuft, ob ein 404 kommt und ob die Antwort zum Schema passt (test_new_tools.py, Zeile 3–9, 247–248); Tools mit\n  \u003ccode>requires_local_input\u003c/code> überspringt es (Zeile 250–262).\u003c/li>\n\u003cli>Aufruf mit einem Muster für Dateinamen oder Tool-Namen, etwa \u003ccode>python scripts/test_new_tools.py fda\u003c/code>\n  (Zeile 11–18, 238–244).\u003c/li>\n\u003cli>Antworten mit \u003ccode>status\u003c/code> gelten dem Skript als neuer Stil, Antworten mit \u003ccode>success\u003c/code> als alter; vor der\n  Schemaprüfung packt es \u003ccode>data\u003c/code> aus, außer das Schema beschreibt selbst die Hülle (Zeile 395–426). Eine\n  Abweichung vom Schema meldet es als „Schema Mismatch“, sie ändert den Exit-Code aber nicht (Zeile 436–462,\n  568–569).\u003c/li>\n\u003cli>Den Fehlertext sucht das Skript auf oberster Ebene und in \u003ccode>data\u003c/code>, weil viele Tools ihn dort ablegen, nach seiner\n  Zählung an rund 87 Stellen (Zeile 184–198).\u003c/li>\n\u003cli>\u003ccode>test_all_tools.py\u003c/code> durchsucht \u003ccode>src/tooluniverse/data/\u003c/code> und ruft \u003ccode>test_new_tools.py\u003c/code> je Präfix auf\n  (README_TEST_ALL_TOOLS.md, Zeile 5–11, 179–185); ein unterbrochener Lauf lässt sich mit \u003ccode>--resume\u003c/code> fortsetzen\n  (Zeile 59–65).\u003c/li>\n\u003cli>Für neue Tools rät die README: JSON-Konfiguration in \u003ccode>src/tooluniverse/data/\u003c/code>, \u003ccode>test_all_tools.py --pattern\u003c/code>\n  für das Tool ausführen, Tests bestehen lassen, „mit Bericht“ committen (Zeile 390–397).\u003c/li>\n\u003cli>Die Wochenprüfung läuft montags um 06:00 UTC gegen die echten APIs, in acht Teilen, als Frühwarnung und nicht\n  als Sperre (weekly-tool-healthcheck.yml, Zeile 3–22, 38); Remote- und MCP-Tools lässt sie aus\n  (\u003ccode>--skip-remote --skip-mcp\u003c/code>, Zeile 104–105) und vergleicht mit der Liste bekannter Ausfälle (Zeile 151–155).\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout contra\" id=\"offen-1\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Die README empfiehlt, \u003ccode>TOOL_TEST_REPORT.md\u003c/code> zu versionieren und neue Tools mit Bericht\nzu committen (README_TEST_ALL_TOOLS.md, Zeile 327–333, 397); der Pre-Push-Hook in\n\u003ca data-page=\"sources/tu-skills-and-githooks\" href=\"#sources/tu-skills-and-githooks\">Skills und Git-Hooks\u003c/a> weist hinzugefügte Markdown-Dateien mit \u003ccode>_REPORT\u003c/code>\nim Namen im Wurzelordner ab.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote class=\"callout contra\" id=\"offen-2\">\n\u003cp>⚠️ \u003cstrong>Widerspruch:\u003c/strong> Viele Tools legen den Fehler in \u003ccode>data\u003c/code> (test_new_tools.py, Zeile 184–198); der\n\u003ca data-page=\"sources/tu-test-writing-guide\" href=\"#sources/tu-test-writing-guide\">Leitfaden für Tests\u003c/a> sagt, Fehler stünden immer auf oberster Ebene.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Relevanz\u003c/h2>\n\u003cp>Prüft ein Tool so, wie Nutzer:innen es aufrufen; deshalb gehören \u003ccode>test_examples\u003c/code> und \u003ccode>return_schema\u003c/code> in jede\nneue Konfiguration.\u003c/p>\n\u003ch2>Verbindungen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Zugang\u003c/h2>\n\u003cp>Volltext als Rohquelle \u003ccode>raw/tu-tool-test-scripts\u003c/code> (\u003ccode>scripts/README_TEST_ALL_TOOLS.md\u003c/code>,\n\u003ccode>scripts/test_new_tools.py\u003c/code>, \u003ccode>.github/workflows/weekly-tool-healthcheck.yml\u003c/code>), unverändert, Stand Commit\n\u003ccode>5f9d8b1\u003c/code>, Apache-2.0. \u003ccode>scripts/test_all_tools.py\u003c/code> selbst gehört nicht dazu.\u003c/p>", "excerpt": "scripts/test_new_tools.py testet Tools mit den Beispielen und dem Rückgabeschema aus ihrer Konfiguration. Die README scripts/README_TEST_ALL_TOOLS.md beschreibt test_all_tools.py, das alle Konfigurationen nach Präfix gruppiert durchläuft und einen Bericht schreibt. .github/workflows/weekly-tool-healthcheck.yml lässt …", "outline": ["Kurzreferat", "Kernaussagen", "Relevanz", "Verbindungen", "Zugang"], "refs": [], "apa": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026i). \u003cem>Tool test scripts and weekly health check\u003c/em> [Software]. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\">https://github.com/mims-harvard/ToolUniverse/tree/5f9d8b192a5cba5912f755d26c1d8e914ea11079\u003c/a>", "open": [{"kind": "contra", "id": "offen-1", "text": "Die README empfiehlt, TOOL_TEST_REPORT.md zu versionieren und neue Tools mit Bericht zu committen (README_TEST_ALL_TOOLS.md, Zeile 327–333, 397); der Pre-Push-Hook in Skills und Git-Hooks weist hinzugefügte …"}, {"kind": "contra", "id": "offen-2", "text": "Viele Tools legen den Fehler in data (test_new_tools.py, Zeile 184–198); der Leitfaden für Tests sagt, Fehler stünden immer auf oberster Ebene."}], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "syntheses/doku-und-code", "title": "Wo Doku und Code auseinanderlaufen", "type": "synthesis", "description": "Die Widersprüche zwischen den Beitragsdokumenten und zum Code auf einen Blick, mit dem, was Code und Konfiguration zeigen.", "access": "", "in": 1, "out": 20, "domain": [], "subtype": "", "subfield": "", "tags": [], "aliases": [], "cite": "", "ris": "", "heading": "Wo Doku und Code auseinanderlaufen", "html": "\u003ch2>Frage\u003c/h2>\n\u003cp>An welchen Stellen widersprechen sich die Beitragsdokumente von ToolUniverse untereinander oder dem Code, und was\ngilt nach Code und Konfiguration?\u003c/p>\n\u003ch2>Kerninsichten\u003c/h2>\n\u003cp>Neun Widersprüche betreffen einen Tool-Beitrag unmittelbar. In sieben davon geben Code oder Konfiguration die\nAntwort; bei zweien stehen zwei Dokumente gegeneinander.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Thema\u003c/th>\n\u003cth>Eine Quelle sagt\u003c/th>\n\u003cth>Andere Quelle oder Code\u003c/th>\n\u003cth>Seite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>__init__.py\u003c/code>\u003c/td>\n\u003ctd>an vier Stellen ändern \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 7; index.rst, Zeile 56; contributing-index.rst, Zeile 23.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 7\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>keine Änderung nötig, Registry und \u003ccode>__all__\u003c/code> füllen sich selbst \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"__init__.py, Zeile 122–166 und 209–217.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 122–166 und 209–217\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dateiname\u003c/td>\n\u003ctd>muss auf \u003ccode>_tool.py\u003c/code> enden \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 150 und 170.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 150 und 170\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>Lazy-Suche: dekorierte Klassen auch in anderen Dateien; nur die vollständige Erkennung braucht \u003ccode>_tool\u003c/code> im Namen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 297–302 und 322–344.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 297–302 und 322–344\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 688–701.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 688–701\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ort der Konfiguration\u003c/td>\n\u003ctd>Kurzreferenz: im Dekorator \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 5–20.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 5–20\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>Leitfaden: JSON-Datei in \u003ccode>data/\u003c/code>; der Dekorator nimmt beides an \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 83 und 361–364.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 83 und 361–364\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 58–89.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 58–89\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unit-Tests\u003c/td>\n\u003ctd>in der Übersicht optional \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 21.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 21\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>im selben Leitfaden Pflicht mit über 90 % Abdeckung \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 370–372; contributing-index.rst, Zeile 25–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 370–372\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hooks beim Commit\u003c/td>\n\u003ctd>Black, Flake8, Ruff \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 197; remote_tools.rst, Zeile 306.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 197\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>Datei-Hooks und Ruff \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 10–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 10–26\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/pruefungen-vor-commit-und-push\" href=\"#concepts/pruefungen-vor-commit-und-push\">Prüfungen vor Commit und Push\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>pytest\u003c/code> ohne Argumente\u003c/td>\n\u003ctd>nur Unit-Tests \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"README.md der Testsuite, Zeile 15.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 15\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>auch Integrationstests \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"pytest.ini, Zeile 3–9.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 3–9\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Antwortformat\u003c/td>\n\u003ctd>\u003ccode>success: True/False\u003c/code>\u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-adding-tools-quickref\" title=\"Adding_Tools_Quick_Reference.md, Zeile 155.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026e, Zeile 155\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>Feld \u003ccode>status\u003c/code>; das Testskript führt \u003ccode>success\u003c/code> als alten Stil \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 171.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 171\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 395–426.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 395–426\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ort des Fehlers\u003c/td>\n\u003ctd>immer auf oberster Ebene \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-test-writing-guide\" title=\"TEST_WRITING_GUIDE.md, Zeile 87–94.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026g, Zeile 87–94\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>viele Tools legen ihn in \u003ccode>data\u003c/code>\u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 184–198.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 184–198\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/antwortformat\" href=\"#concepts/antwortformat\">Antwortformat eines Tools\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Testbericht\u003c/td>\n\u003ctd>mit Bericht committen \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"README_TEST_ALL_TOOLS.md, Zeile 327–333 und 397.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 327–333 und 397\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>der Pre-Push-Hook weist \u003ccode>*_REPORT.md\u003c/code> im Wurzelordner ab \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-skills-and-githooks\" title=\"pre-push, Zeile 9–20.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026j, Zeile 9–20\u003c/a>)\u003c/span>\u003c/td>\n\u003ctd>\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Dazu kommen Stellen, die keine Quelle klärt und die deshalb als Prüfvermerk auf ihrer Seite stehen: die\nTypprüfung in der CI (\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>), \u003ccode>examples\u003c/code> neben \u003ccode>test_examples\u003c/code>\n(\u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>), die Zahl der Skills\n(\u003ca data-page=\"concepts/skills-beitragen\" href=\"#concepts/skills-beitragen\">Agent-Skills beitragen\u003c/a>), die Ruff-Versionen (\u003ca data-page=\"entities/ruff\" href=\"#entities/ruff\">Ruff\u003c/a>) und\n\u003ccode>uv\u003c/code> neben \u003ccode>venv\u003c/code> (\u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>).\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"syntheses/erster-tool-beitrag\" href=\"#syntheses/erster-tool-beitrag\">Der Weg zum ersten Tool-Beitrag\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "An welchen Stellen widersprechen sich die Beitragsdokumente von ToolUniverse untereinander oder dem Code, und was gilt nach Code und Konfiguration?", "outline": ["Frage", "Kerninsichten", "Verwandte Seiten"], "refs": [{"key": "tu-expand-contributing", "page" cess": "fulltext", "order": 9}], "apa": null, "open": [], "updated": "2026-10-25"}, {"license": null, "rights": [], "stored": [], "fundweg": [], "scope": "", "scope_derived": false, "id": "syntheses/erster-tool-beitrag", "title": "Der Weg zum ersten Tool-Beitrag", "type": "synthesis", "description": "Von der Entwicklungsumgebung bis zum Pull Request; welche Schritte ein neues lokales Tool braucht und wo der Code die Doku korrigiert.", "access": "", "in": 5, "out": 19, "domain": [], "subtype": "", "subfield": "", "tags": ["einstieg"], "aliases": [], "cite": "", "ris": "", "heading": "Der Weg zum ersten Tool-Beitrag", "html": "\u003ch2>Frage\u003c/h2>\n\u003cp>Was braucht ein neues lokales Tool, bis es als Pull Request bei ToolUniverse eingereicht werden kann, und worauf\nist zu achten, wo sich die Doku widerspricht?\u003c/p>\n\u003ch2>Kerninsichten\u003c/h2>\n\u003cpre class=\"diagram\">\u003ccode class=\"language-text\">Fork, Klon, pip install -e &quot;.[dev]&quot;, setup_precommit.sh          Entwicklungsumgebung\n        │\nsrc/tooluniverse/mein_tool.py           @register_tool(&quot;MeinTool&quot;)\nsrc/tooluniverse/data/mein_tools.json   name, type, description, parameter, test_examples, return_schema\n        │\npytest tests/unit/…   ·   python scripts/test_new_tools.py mein                         Tests\n        │\nbuild_tools.py --force · generate_lazy_registry.py · gen_api_key_catalog.py    erzeugte Dateien\n        │\ngit commit (pre-commit: Datei-Hooks, Ruff)   →   Pull Request mit Vorlage\n\u003c/code>\u003c/pre>\n\u003col>\n\u003cli>\u003cstrong>Umgebung:\u003c/strong> Fork klonen, editierbar mit den Entwicklungs-Extras installieren, pre-commit einrichten\n   (\u003ca data-page=\"concepts/entwicklungsumgebung\" href=\"#concepts/entwicklungsumgebung\">Entwicklungsumgebung einrichten\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 12–53.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 12–53\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003cstrong>Klasse und Konfiguration:\u003c/strong> Klasse mit \u003ccode>@register_tool\u003c/code> in \u003ccode>src/tooluniverse/\u003c/code>, Konfiguration als JSON in\n   \u003ccode>src/tooluniverse/data/\u003c/code> (\u003ca data-page=\"concepts/lokales-tool\" href=\"#concepts/lokales-tool\">Lokales Tool\u003c/a>,\n   \u003ca data-page=\"concepts/tool-konfiguration\" href=\"#concepts/tool-konfiguration\">Tool-Konfiguration (JSON)\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 50–61 und 102–105.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 50–61 und 102–105\u003c/a>)\u003c/span>. \u003ccode>__init__.py\u003c/code> muss nach dem Code\n   nicht geändert werden, auch wenn Teile der Doku das noch verlangen; ein Dateiname auf \u003ccode>_tool.py\u003c/code> hilft der\n   vollständigen Erkennung (\u003ca data-page=\"concepts/register-tool-und-erkennung\" href=\"#concepts/register-tool-und-erkennung\">Registrierung und automatische Erkennung\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"__init__.py, Zeile 122–166 und 209–217.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 122–166 und 209–217\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tool-registry-code\" title=\"tool_registry.py, Zeile 688–701.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026h, Zeile 688–701\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003cstrong>Tests:\u003c/strong> Unit-Tests in \u003ccode>tests/unit/\u003c/code> mit Marker\n   (\u003ca data-page=\"concepts/testkategorien-und-marker\" href=\"#concepts/testkategorien-und-marker\">Testkategorien und pytest-Marker\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-expand-contributing\" title=\"local_tools.rst, Zeile 151–154.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026b, Zeile 151–154\u003c/a>; \u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"README.md der Testsuite, Zeile 37–43.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 37–43\u003c/a>)\u003c/span>. Mit\n   \u003ccode>test_examples\u003c/code> und \u003ccode>return_schema\u003c/code> in der Konfiguration prüft \u003ccode>test_new_tools.py\u003c/code> das Tool selbst\n   (\u003ca data-page=\"concepts/tool-tests-mit-beispielen\" href=\"#concepts/tool-tests-mit-beispielen\">Tool-Tests mit Beispielen und Schema\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tool-test-scripts\" title=\"test_new_tools.py, Zeile 3–9 und 247–248.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026i, Zeile 3–9 und 247–248\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003cstrong>Erzeugte Dateien:\u003c/strong> die drei Generatoren laufen lassen und ihr Ergebnis mitcommitten, sonst scheitert die\n   CI (\u003ca data-page=\"concepts/generierte-dateien\" href=\"#concepts/generierte-dateien\">Generierte Dateien\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-tests-and-ci\" title=\"tests.yml, Zeile 142–171.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026f, Zeile 142–171\u003c/a>)\u003c/span>.\u003c/li>\n\u003cli>\u003cstrong>Commit und Pull Request:\u003c/strong> Branch und Commit-Nachricht nach Conventional Commits \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-contributing-guide\" title=\"contributing.rst, Zeile 239–276.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026a, Zeile 239–276\u003c/a>)\u003c/span>; pre-commit prüft\n   dabei Dateien unter \u003ccode>src/tooluniverse/\u003c/code> mit Ruff \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pre-commit\" title=\".pre-commit-config.yaml, Zeile 1 und 10–26.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026c, Zeile 1 und 10–26\u003c/a>)\u003c/span>. Im Pull Request die Punkte der Vorlage abhaken\n   (\u003ca data-page=\"analyses/checkliste-vor-dem-pr\" href=\"#analyses/checkliste-vor-dem-pr\">Prüfliste vor dem Pull Request\u003c/a>) \u003cspan class=\"cite\">(\u003ca class=\"cite-ref\" href=\"#lit-tu-pr-template\" title=\"pull_request_template.md, Zeile 5–17.\">\u003cspan class=\"nocase\">mims-harvard\u003c/span>, 2026d, Zeile 5–17\u003c/a>)\u003c/span>.\u003c/li>\n\u003c/ol>\n\u003cp>Wo sich die Doku widerspricht, folgt dieser Weg dem Code und der Konfiguration; die Stellen sammelt\n\u003ca data-page=\"syntheses/doku-und-code\" href=\"#syntheses/doku-und-code\">Wo Doku und Code auseinanderlaufen\u003c/a>.\u003c/p>\n\u003ch2>Verwandte Seiten\u003c/h2>\n\u003cul>\n\u003cli>\u003ca data-page=\"entities/tooluniverse\" href=\"#entities/tooluniverse\">ToolUniverse\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/remote-tool\" href=\"#concepts/remote-tool\">Remote-Tool\u003c/a>\u003c/li>\n\u003cli>\u003ca data-page=\"concepts/ci-testlauf\" href=\"#concepts/ci-testlauf\">CI-Testlauf\u003c/a>\u003c/li>\n\u003c/ul>", "excerpt": "Was braucht ein neues lokales Tool, bis es als Pull Request bei ToolUniverse eingereicht werden kann, und worauf ist zu achten, wo sich die Doku widerspricht?", "outline": ["Frage", "Kerninsichten", "Verwandte Seiten"], "refs": [{"key": "tu-contributing-guide", "page": "sources/tu-contributing-guide", "entry": "\u003cspan class=\"nocase\">mims-harvard\u003c/span>. (2026a, Oktober 24). \u003cem>Contributing to ToolUniverse\u003c/em>. GitHub. \u003ca href=\"https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\">https://github.com/mims-harvard/ToolUniverse/blob/5f9d8b192a5cba5912f755d26c1d8e914ea11079/docs/about/contributing.rst\u003c/a>", "access": "fulltext", "order": 0}, {"key": "tu-expand-contributing", "page": "sources/tu-expand-contributing", "entry": "\u003cspan class=\"nocase\">mims-har <script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("okf-data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const typeLabels = Object.fromEntries(D.types.map(t => [t.name, t.label]));

  const lab = (field, value) => ((D.labels || {})[field] || {})[value] || value;

  const RWORD = { ja: "erlaubt", bedingt: "mit Auflage", nein: "nicht erlaubt", fragen: "erst fragen" };
  const licShort = n => (!n.license ? "" : n.license.cls === "unbekannt" ? "Lizenz unbekannt"
    : n.license.name && n.license.name.length <= 28 ? n.license.name : n.license.label);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const c of kids) if (c !== null && c !== undefined && c !== false) e.append(c);
    return e;
  }
  function s(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);

  for (const n of nodes) { n.nb = new Set(); n.outs = new Map(); n.ins = new Map(); }
  const edges = [];

    if (!a || !b) continue;
    edges.push({ s: a, t: b, kind: e.kind });
    a.nb.add(b); b.nb.add(a);
    if (!a.outs.has(b)) a.outs.set(b, new Set());
    a.outs.get(b).add(e.kind);
    if (!b.ins.has(a)) b.ins.set(a, new Set());
    b.ins.get(a).add(e.kind);
  }
  // Reihenfolge der Arten in Chips, Kacheln, Tabelle, Übersichten und Schichtengraph: von der Grundlage zum
  // Querschnitt (Quellen, Entitäten, Konzepte, Synthesen, Analysen), weitere Profiltypen danach in der

  const profileOrder = [...D.types.map(t => t.name).filter(t => nodes.some(n => n.type === t)),
